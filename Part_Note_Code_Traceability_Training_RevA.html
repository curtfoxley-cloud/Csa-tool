{
 id:"M2", label:"Module 2", title:"Serialization sources", sub:"Where serialization requirements come from: Airworthiness Limitation Items, Principal Structural Elements, and premium selected materials, and how each one sets the codes",
 sections:[
 {id:"M2-01", gov:["R_SER_SOURCES"], title:"Where serialization comes from", body:[
    P("SER drives one action: record serial numbers, or apply and record serial numbers. The requirement behind that action comes from many places."),
    TABLE(["Source", "Why it needs a serial number", "Where this course covers it"], [
      ["Cycle/usage-controlled life-limited items", "Remaining life is a per-unit quantity", "M5-03"],
      ["Airworthiness Limitation Items on a discrete part", "14 CFR 45.15(c) requires the serial number", "M2-02 to M2-05"],
      ["Safe-life Principal Structural Elements, and discrete damage-tolerant PSE parts", "An ALS entry attaches to a discrete part", "M2-06, M2-07"],
      ["Premium selected materials", "Each test result must tie to one part instance", "M2-08"],
      ["Critical Safety Items", "Serialization reaches them through IUID", "M5-06"],
      ["Fracture-Critical Traceable Parts", "MIL-STD-1530 names serialization as a control", "M5-07"],
      ["DoD serially managed items and parent items", "Every UII carries a serial number", "M4-05 to M4-09"],
      ["Every physical parent of a serialized or lot/batch recorded item", "The climb to the end item", "M4-02"]]),
    P("The sources differ. The result does not. Once an item carries SER, the climb to the end item applies."),
    P("This module covers the sources that come from the airworthiness regulations for transport category airplanes, 14 CFR Part 25, and the marking rules in 14 CFR Part 45.")
  ],
  check:{q:"Which of these does NOT, on its own, drive serialization?",
   o:[
     "A Safety-Critical Item designation under MIL-STD-882E",
     "An Airworthiness Limitations Section entry on a discrete part",
     "A premium selection of material under 14 CFR 25.613(e)",
     "Being the physical parent of a lot/batch recorded item"],
   a:0, why:"A Safety-Critical Item designation drives design and process controls. It does not drive serialization on its own. Module 5 covers it. The other three are serialization sources: 14 CFR 45.15(c) for the ALS entry, the need to tie each test to one part for premium selection, and the climb for a physical parent."}},

 {id:"M2-02", gov:["R_ALI"], title:"Airworthiness Limitation Items", body:[
    P("Start with where the limit is published."),
    P("14 CFR 25.1529 requires Instructions for Continued Airworthiness (ICA), prepared in accordance with Appendix H to Part 25. Paragraph H25.4 of Appendix H establishes the content of the Airworthiness Limitations Section (ALS). Appendix H also requires the ALS to state, in a prominent location, that it is FAA-approved and specifies maintenance required under 14 CFR 43.16 and 91.403, unless an alternative program has been FAA approved. The limits in it are mandatory."),
    C("Definition", [
      "An **Airworthiness Limitation Item (ALI)** is an item holding a mandatory replacement time, structural inspection interval, or related procedure approved as part of the type design and published in the Airworthiness Limitations Section (ALS) of the Instructions for Continued Airworthiness (ICA)."]),
    P("The marking rule is in 14 CFR 45.15(c), under the heading Critical parts:"),
    C("14 CFR 45.15(c)", [
      "“Each person who manufactures a part for which a replacement time, inspection interval, or related procedure is specified in the Airworthiness Limitations section of a manufacturer’s maintenance manual or Instructions for Continued Airworthiness must permanently and legibly mark that part with a serial number (or equivalent) unique to that part in addition to the other applicable requirements of this section.”"], "teal"),
    P("Read the rule for its triggers. There are three. A replacement time. An inspection interval. A related procedure. Any one of them requires the serial number."),
    S("The trigger is the ALS entry. The form of the limit does not matter.")
  ],
  check:{q:"An ALS entry gives a discrete fitting a structural inspection interval. It carries no replacement time. Does 14 CFR 45.15(c) require a serial number on the fitting?",
   o:[
     "Yes. An inspection interval is one of the three triggers",
     "No. Only a replacement time triggers the rule",
     "No. Structural inspections are always tracked by airplane, not by part",
     "Only if the fitting is also a Critical Safety Item"],
   a:0, why:"14 CFR 45.15(c) names a replacement time, an inspection interval, or a related procedure. Any one is enough. The fitting is a discrete, separately manufactured part, so it takes SER. It does not take LL, because an inspection interval is not a replacement limit. Tracking by airplane applies to an inspection at a location with no separately manufactured part."}},

 {id:"M2-03", gov:["R_ALI_QUESTIONS"], title:"Three questions set the codes", body:[
    P("Three questions set the codes for an ALI. They are independent. Answer all three."),
    STEPS([
      {h:"What does the ALS entry attach to?", b:"This sets the identity code. A discrete part takes SER. An airframe location or zone with no separately manufactured part takes no code."},
      {h:"Does the entry carry a mandatory replacement limit?", b:"This sets whether LL applies, and nothing else. A replacement limit adds LL. An inspection interval or a related procedure alone does not."},
      {h:"How is the replacement limit expressed?", b:"This sets which LL note text to use. It does not change the identity code. Answer it only when the second answer is yes."}]),
    TABLE(["The ALS entry attaches to", "The entry carries", "Codes", "LL note text"], [
      ["A discrete part", "A mandatory replacement limit in cycles, landings, or flight hours", "SER, LL", "Cycle/usage"],
      ["A discrete part", "A mandatory replacement limit in calendar time", "SER, LL", "Age and shelf-life"],
      ["A discrete part", "An inspection interval or a related procedure only", "SER", "None"],
      ["An airframe location or zone, with no separately manufactured part", "Any of the three triggers", "None", "None"],
      ["A manufactured lot/batch of material, not a discrete part", "A mandatory replacement limit (uncommon)", "LOT, LL", "Per the limit expressed"]]),
    P("A part often carries both a replacement limit and an inspection interval. Inspect every 5,000 cycles, replace at 30,000 cycles, for example. Use the row for the replacement limit. The inspection interval adds no code of its own."),
    P("An ALI part may also be a Critical Safety Item, a Fracture-Critical Traceable Part, or a premium selected material part. The codes stack. Apply every code each source drives.")
  ],
  check:{q:"An ALS entry for a discrete lug reads: inspect every 5,000 flight cycles, replace at 30,000 flight cycles. Which codes apply?",
   o:[
     "SER and LL, with the cycle/usage LL note text",
     "SER only, because the inspection interval comes first",
     "SER and two LL notes, one for each limit",
     "LOT and LL, because the limit is stated in cycles"],
   a:0, why:"The entry attaches to a discrete part, so SER. It carries a mandatory replacement limit, so LL. The limit is in cycles, so the cycle/usage note text. The inspection interval adds no code of its own. Nothing about cycles points to lot/batch recording. Cycles are counted per unit."}},

 {id:"M2-04", gov:["R_ALI_CALENDAR"], title:"Calendar limits and parts too small to mark", body:[
    P("The third question is the one most often misread."),
    P("An oxygen cylinder carries an ALS replacement limit of 5 years. The limit is calendar time. Calendar time sounds like shelf life, and shelf life sounds like lot/batch recording. That chain of association is wrong."),
    S("A calendar-limited ALI on a discrete part is still serialized.",
      "14 CFR 45.15(c) does not care how the limit is expressed. Calendar time changes the LL note text. It does not move the part to lot/batch recording."),
    P("The oxygen cylinder takes SER and LL, with the age and shelf-life LL note text:"),
    NOTE("LL_AGE"),
    NOTE("SER_L"),
    P("Some ALI parts are too small to mark. 14 CFR 45.15(d) covers them:"),
    C("14 CFR 45.15(d)", [
      "“If the FAA finds a part or article is too small or otherwise impractical to mark with any of the information required by this part, the manufacturer must attach that information to the part or its container.”"], "teal"),
    P("The part still carries a unique serial number. The number moves to a tag or to the container. Lot/batch recording does not replace it.")
  ],
  check:{q:"A small ALI spring has a calendar replacement limit and is too small to mark. A planner proposes lot/batch recording instead of serialization. What is the correct response?",
   o:[
     "Keep SER. Attach the unique serial number to the part or container under 45.15(d)",
     "Accept it. A calendar limit and a small size both point to lot/batch recording",
     "Accept it, but add LL with the cycle/usage note text",
     "Remove both codes. A part the FAA finds too small to mark is exempt from 45.15(c)"],
   a:0, why:"45.15(c) requires a serial number unique to the part, whatever form the limit takes. 45.15(d) changes where the information goes, onto the part or its container. It does not remove the requirement. The calendar limit sets the age and shelf-life LL note text, not the cycle/usage one."}},

 {id:"M2-05", gov:["R_ALI_LOT"], title:"Limits on a lot, and shelf life", body:[
    P("An ALS entry normally lists a part number, a limit, and a task. It is expressed against a part."),
    P("It can be expressed against a manufactured lot/batch of material instead. This is uncommon. Where it happens, the material takes LOT and LL rather than SER."),
    P("Do not confuse that case with shelf life. Shelf life and cure date limits also attach to lots. They live in the maintenance manual or the material specification. They do not live in the ALS."),
    CARDS([
      {h:"Airworthiness limitation", b:"Published in the ALS. Approved as part of the type design. Drives 45.15(c) marking when it attaches to a discrete part."},
      {h:"Shelf life or cure date", b:"Published in the maintenance manual or the material specification. Attaches to a manufacturing lot/batch. Drives LL and LOT."}], 2),
    S("Airworthiness limitations and shelf life are separate regimes.",
      "Ask where the limit is published before you ask how it is expressed.")
  ],
  check:{q:"A structural adhesive has a cure date limit stated in its material specification. It has no ALS entry. Which codes apply?",
   o:[
     "LL and LOT",
     "SER and LL, because 45.15(c) applies to any life limit",
     "LOT only, because a cure date is not a life limit",
     "LL only, because the material specification controls the limit"],
   a:0, why:"The limit lives in the material specification, not the ALS, so 45.15(c) does not apply. The limit attaches to the manufacturing batch. That makes the adhesive an age/shelf-life-controlled item: LL with the age and shelf-life note text, and LOT. LL alone creates no record."}},

 {id:"M2-06", gov:["R_PSE"], title:"Safe-life Principal Structural Elements", body:[
    P("Most transport airplane structure is damage tolerant. It is designed to carry load with a crack present until an inspection finds the crack. Some structure cannot meet that standard. For that structure, the applicant shows it will not crack during its service life, then retires it before that life ends."),
    C("Definition", [
      "A **Safe-Life Principal Structural Element (PSE)** is a PSE for which the applicant establishes that compliance with the damage-tolerance requirements is impractical. Under 14 CFR 25.571(c), that structure must instead be shown by analysis supported by test evidence to withstand the repeated loads of variable magnitude expected during its service life without detectable cracks."]),
    P("The resulting safe-life limit is published as an ALS mandatory replacement time, in flight cycles or flight hours. That makes a safe-life PSE a cycle/usage-controlled life-limited item under 14 CFR 43.10."),
    P("A safe-life PSE that is a discrete part with an ALS replacement time is serialized under 14 CFR 45.15(c). It takes LL and SER."),
    P("Its underlying detail parts are treated differently. Lot/batch recording applies to the raw material heat and lot of those detail parts. It does not apply to the safe-life PSE part itself."),
    C("Not a part replacement time: the Limit of Validity", [
      "The **Limit of Validity (LOV)** bounds the engineering data that supports the airplane’s structural maintenance program. It applies to the airplane. It is not a part replacement time.",
      "A safe-life limit retires a part. The LOV bounds the airplane. Do not apply LL to a part because of the LOV."])
  ],
  check:{q:"A landing gear side brace is a safe-life PSE with an ALS replacement time of 60,000 landings. It is a discrete part. Which codes apply to the brace itself?",
   o:[
     "LL and SER",
     "LOT, because safe-life structure is traced by raw material heat",
     "LL only, because the ALS already controls the brace",
     "SER only, because the Limit of Validity sets its life"],
   a:0, why:"A safe-life PSE with an ALS replacement time is a cycle/usage-controlled life-limited item, so LL. It is a discrete part with an ALS entry, so 45.15(c) requires SER. Heat and lot traceability applies to its detail parts, not to the brace itself. The LOV bounds the airplane, not a part."}},

 {id:"M2-07", gov:["R_PSE_DT"], title:"Damage-tolerant PSEs and constituent materials", body:[
    P("A damage-tolerant PSE is treated two ways. The difference is what the ALS entry attaches to."),
    CARDS([
      {h:"Inspection at a location", b:"The ALS entry is a structural inspection at an airframe location. There is no separately manufactured part. No serialization. The PSE is tracked by airplane and structural location. No code."},
      {h:"Inspection on a discrete part", b:"The PSE is a discrete, separately manufactured part with an ALS inspection interval. 14 CFR 45.15(c) requires serialization. SER."}], 2),
    P("Constituent materials follow a third path. Composite resins, structural adhesives, and prepregs go into PSEs. They are too small to serialize. Before installation, they are age and shelf-life limited, and they are lot/batch recorded. Once installed, they inherit the cycle and usage life of their higher-level assembly."),
    TABLE(["PSE case", "Codes"], [
      ["Safe-life PSE, discrete part with an ALS replacement time", "LL, SER"],
      ["Safe-life PSE detail parts and constituent materials", "LOT"],
      ["Damage-tolerant PSE, discrete part with an ALS inspection interval", "SER"],
      ["Damage-tolerant PSE, location-based inspection", "None"]]),
    P("Every row that carries SER or LOT starts a climb to the end item.")
  ],
  check:{q:"A composite prepreg with a storage age limit is cured into a safe-life PSE. How is the prepreg's traceability handled?",
   o:[
     "Lot/batch recorded before installation; once installed it inherits the PSE's cycle and usage life",
     "Serialized, because it becomes part of a serialized PSE",
     "Not recorded, because the PSE's serial number covers everything inside it",
     "Given its own cycle/usage LL note and a serial number, because the PSE it goes into is cycle-limited"],
   a:0, why:"Constituent materials are too small to serialize. Their storage limit attaches to the lot, so they are lot/batch recorded. After cure they are part of the PSE and share its cycle and usage life. The lot record is what connects a suspect batch of prepreg to the PSEs it went into."}},

 {id:"M2-08", gov:["R_PREMIUM"], title:"Premium selected materials", body:[
    P("Material design values set how much stress analysis lets a part carry. 14 CFR 25.613 governs them."),
    P("Under 14 CFR 25.613(b), design values must be chosen to minimize the probability of structural failure due to material variability. Where applied loads eventually pass through a single member whose failure would cost the component its structural integrity, the values must assure material strength with 99 percent probability at 95 percent confidence. Engineers call this the A-basis. For redundant structure, where a failed element sheds its load safely to other members, the standard is 90 percent probability at 95 percent confidence, the B-basis."),
    P("Premium selection is the condition on which greater values may be used. Under 14 CFR 25.613(e), greater material design values may be used:"),
    C("14 CFR 25.613(e)", [
      "“if a ‘premium selection’ of the material is made in which a specimen of each individual item is tested before use to determine that the actual strength properties of that particular item will equal or exceed those used in design.”"], "teal"),
    P("The key words are “each individual item.” Each part is tested. Each result belongs to one part."),
    S("Serialization is required in practice, although neither 14 CFR 25.613(e) nor AC 25.613-1 names it.",
      "Each test result must tie to one part instance, from specimen through acceptance to installation. Only a distinctive product-unit identifier can hold that tie."),
    P("Lot/batch recording does the other half. It captures heat and lot traceability, and a record that correlates each specimen to its part. If the part also carries an ALS entry, 45.15(c) marking applies as well."),
    P("A premium selected material part takes SER and LOT.")
  ],
  check:{q:"A stress team raises the allowable on forged fittings by testing a prolongation coupon from each forging before use. Why must each fitting be serialized?",
   o:[
     "Each test result must stay tied to one fitting from specimen to installation",
     "14 CFR 25.613(e) states a serialization requirement in its text",
     "Forgings are always cycle-limited, so they are always serialized",
     "Serialization of each fitting replaces the need for heat and lot records on the forgings"],
   a:0, why:"Premium selection qualifies each individual item by its own test. The higher allowable is only valid for the fitting that passed. That link survives only if each fitting has its own identifier. The rule does not name serialization, which is why this is called a requirement in practice. Lot/batch recording is still needed for heat traceability, so the fitting takes SER and LOT."}}
 ],
 drill:[
  {id:"M2-L1", find:"2", pn:"EX-6610-551", nm:"BRACE, SIDE, MAIN LANDING GEAR",
   facts:["Safe-life PSE.","Discrete part with an ALS replacement time of 60,000 landings."],
   a:["LL","SER"], why:"A safe-life PSE with an ALS replacement time is cycle/usage-controlled, so LL with the cycle/usage note text. It is a discrete part with an ALS entry, so 45.15(c) requires SER."},
  {id:"M2-L2", find:"4", pn:"EX-8850-012", nm:"CYLINDER, OXYGEN, CREW",
   facts:["Discrete part.","ALS replacement limit: 15 years from date of manufacture."],
   a:["SER","LL"], why:"A calendar-limited ALI on a discrete part is still serialized. 45.15(c) does not care how the limit is expressed. The calendar limit sets the age and shelf-life LL note text."},
  {id:"M2-L3", find:"7", pn:"EX-5120-230", nm:"FITTING, STABILIZER ATTACH",
   facts:["Discrete, separately manufactured part.","ALS entry: inspect every 6,000 flight cycles. No replacement time."],
   a:["SER"], why:"An inspection interval is one of the three 45.15(c) triggers, so SER. There is no replacement limit, so no LL."},
  {id:"M2-L4", find:"n/a", pn:"Location 4-118", nm:"WING LOWER SKIN, STRINGER 12 RUNOUT (INSPECTION ZONE)",
   facts:["ALS entry: inspect the zone every 12,000 flight cycles.","No separately manufactured part is identified by the entry."],
   a:[], why:"The entry attaches to an airframe location with no separately manufactured part. It is tracked by airplane and structural location. No code."},
  {id:"M2-L5", find:"3", pn:"EX-7730-118", nm:"FITTING, WING-TO-BODY, FORGED",
   facts:["Uses elevated design values under a premium selection.","A coupon from each forging is tested before use."],
   a:["SER","LOT"], why:"Each test result must tie to one part instance, so SER. Heat and lot traceability and the specimen-to-part correlation need LOT."},
  {id:"M2-L6", find:"5", pn:"EX-6610-560", nm:"LUG, FORGED, DETAIL (INSIDE A SAFE-LIFE PSE ASSEMBLY)",
   facts:["A detail part of a safe-life PSE assembly.","It holds no ALS entry of its own.","Its raw material heat and lot must be traceable."],
   a:["LOT"], why:"Safe-life PSE detail parts carry lot/batch recording for raw material heat and lot. The serial number and LL belong to the PSE part that holds the ALS replacement time."},
  {id:"M2-L7", find:"8", pn:"EX-8850-044", nm:"LUG, INSPECT AND REPLACE",
   facts:["Discrete part.","ALS entry: inspect every 5,000 flight cycles and replace at 30,000 flight cycles."],
   a:["SER","LL"], why:"Use the row for the replacement limit. SER for the discrete part, LL with the cycle/usage note text. The inspection interval adds no code of its own."}
 ],
 exercises:[
  {id:"M2-E1", title:"Exercise 1: Reading an Airworthiness Limitations Section",
   scen:"You are given four ALS entries. (1) Main landing gear side brace, a discrete part: replace at 60,000 landings. (2) Wing lower skin at a stringer runout: inspect every 12,000 flight cycles; no separately manufactured part is identified. (3) Crew oxygen cylinder, a discrete part: replace at 15 years. (4) Horizontal stabilizer attach fitting, a discrete part: inspect every 6,000 flight cycles and replace at 45,000 flight cycles.",
   parts:[
    {id:"a", q:"Give the codes for each entry, and the LL note text where LL applies. For each one, say which of the three questions decided it."},
    {id:"b", q:"A reviewer argues that entry 3 should be lot/batch recorded because its limit is calendar time. Answer the reviewer, citing the rule."},
    {id:"c", q:"Entry 4 carries two limits. Explain why only one of them drives LL."},
    {id:"d", q:"Entry 2 takes no code. Explain how that location is still controlled."},
    {id:"e", q:"Which entries start a climb to the end item, and what does the climb require of their parents?"}
   ]},
  {id:"M2-E2", title:"Exercise 2: A premium selection program",
   scen:"A stress team wants to raise the design allowable on a set of forged fittings. A coupon from each forging's prolongation will be tested before the fitting is used. The forgings come from three heats. The fittings go into a wing-to-body joint assembly.",
   parts:[
    {id:"a", q:"Which regulation permits this, and what does it require of each item?"},
    {id:"b", q:"The rule does not name serialization. Explain why serialization is still required."},
    {id:"c", q:"What does lot/batch recording add that serialization does not?"},
    {id:"d", q:"Which codes go on the fitting? Which codes does the joint assembly take, and why?"},
    {id:"e", q:"One coupon record cannot be matched to a fitting. What does that mean for the fitting, and what would you ask for?"}
   ]}
 ]
},

{
 id:"M3", label:"Module 3", title:"Lot/batch sources and special handling", sub:"Where lot/batch recording requirements come from: castings, process and batch conditions, counterfeit avoidance for electronic parts, and special handling, including explosive and radioactive material",
 sections:[
 {id:"M3-01", gov:["R_LOT_SOURCES"], title:"Where lot/batch recording comes from", body:[
    P("LOT drives one action: record lot/batch numbers, or apply and record lot/batch numbers. As with SER, the requirement comes from many places."),
    TABLE(["Source", "Why the lot matters", "Where this course covers it"], [
      ["Age/shelf-life-controlled life-limited items", "The limit attaches to the manufacturing lot/batch", "M5-04"],
      ["ALIs expressed against a manufactured lot/batch (uncommon)", "The ALS limit is on the lot", "M2-05"],
      ["Safe-life PSE detail parts and constituent materials", "Raw material heat and lot", "M2-06, M2-07"],
      ["Premium selected materials", "Heat traceability and specimen correlation", "M2-08"],
      ["Critical Safety Items", "Traceability to an approved source, with lot and heat control", "M5-06"],
      ["Fracture-Critical Traceable Parts and Fracture-Critical Parts", "Fracture control relies on material properties and process condition", "M5-07"],
      ["Castings and alternative approved material design values", "Batch records support reduced inspection or approved values", "M3-02"],
      ["Process and batch conditions", "Identity or performance is set by a batch", "M3-03"],
      ["Counterfeit avoidance for electronic parts", "The source chain back to the original manufacturer", "M3-04, M3-05"],
      ["Special handling, including explosive and radioactive material", "Handling conditions are recorded as a lot", "M3-06 to M3-09"]]),
    P("Recall the two note forms. A raw material callout takes the short LOT text. A detail part or vendor part takes the long one. And recall the location gap: the parent of a lot/batch recorded item is serialized, so every LOT item starts a climb to the end item.")
  ],
  check:{q:"Sealant is called out in bulk on a parts list, and the specification requires lot traceability. A vendor O-ring on the same list also requires lot/batch recording. Which note texts apply?",
   o:[
     "Short LOT text on the sealant, long LOT text on the O-ring",
     "Long LOT text on both, because both require traceability",
     "Short LOT text on both, because neither is serialized",
     "No LOT on the sealant, because bulk material cannot be traced"],
   a:0, why:"A raw material callout, such as bar stock, sheet, plate, or bulk sealant, takes the short LOT text. A detail part or a vendor part that holds a lot/batch recording requirement takes the long text, which carries the climb to the end item inside the note."}},

 {id:"M3-02", gov:["R_CASTINGS"], title:"Castings and alternative design values", body:[
    P("A casting's strength varies more than wrought material does. Porosity and inclusions hide inside it. 14 CFR 25.619 requires special factors wherever strength is uncertain, and 14 CFR 25.621 sets the **casting factors** for castings. A casting factor is an extra factor of safety applied to the casting's design loads."),
    P("Three conditions in Part 25 depend on production lot and batch records."),
    L([
      "**Non-critical castings with reduced non-visual inspection.** 14 CFR 25.621(d)(5) allows the number of castings per production batch inspected by non-visual methods to be reduced when an approved quality control procedure is established. Quality control must track and record each production batch to support the reduced sampling. See FAA AC 25.621-1.",
      "**Castings using process monitoring to support a casting factor of 1.0.** 14 CFR 25.621(c)(1) and 14 CFR 25.621(d)(1) allow a casting factor of 1.0 or greater under stated conditions. For critical castings, those conditions include process monitoring with testing of coupons cut from the prolongations of each casting, or of each set of castings produced from a single pour into a single mold in a runner system. Records must tie each coupon to its casting or pour. See FAA AC 25.621-1.",
      "**Alternative approved material design values.** 14 CFR 25.613(f) permits other material design values when the Administrator approves them. The rule does not itself require lot/batch records. The approval carries process and statistical conditions. Production lot and batch records show ongoing conformity to those conditions."]),
    S("In each case, the batch record is what earns the reduced factor, the reduced sampling, or the approved value.",
      "Lose the batch record and the relief goes with it."),
    P("Each of these items takes LOT.")
  ],
  check:{q:"A non-critical casting program samples fewer castings per batch for radiographic inspection under an approved quality control procedure. Why does the casting take LOT?",
   o:[
     "The reduced sampling is only valid if each production batch is tracked and recorded",
     "Every casting is serialized, and LOT is its identity code",
     "14 CFR 25.621 requires a serial number on every casting",
     "Castings always carry a shelf-life limit that attaches to the pour, so the pour is recorded"],
   a:0, why:"Reduced sampling means the uninspected castings are accepted on the evidence of their batch. That argument only holds if each casting can be tied to its batch. The production batch record does that. Nothing here requires serialization, and castings carry no shelf life."}},

 {id:"M3-03", gov:["R_PROCESS_BATCH"], title:"Process and batch conditions", body:[
    P("Some items get their identity or their performance from a batch rather than from a unit. Lot/batch recording applies to:"),
    L([
      "Items fabricated using specific batches of bulk materials or processes.",
      "Items whose testing or certification is conducted by lot/batch.",
      "Items whose performance may depend on process or batch conditions, including storage conditions, temperature, solution strength, application technique, and cure time."]),
    P("Common examples: printed wiring boards, heat-treated high-strength material, forged items, specialized metallic fasteners for heat and lot traceability, parts and materials with specific storage requirements, cured epoxy-filled honeycomb panels, electrical fuses, O-rings, simple high-volume electromechanical switches, and filters. The switches are standard toggles, general-purpose push-button switches, circuit breakers, and internal switches used inside non-critical line replaceable units."),
    P("This is the widest lot/batch source by item count."),
    C("Fasteners are not life-limited", [
      "Specialized metallic fasteners have no shelf life. They carry heat and lot traceability. They take LOT under this source. They do not take LL.",
      "The pattern to avoid is reasoning from “lot recorded” to “shelf life.” Many lot-recorded items have no life limit at all."]),
    P("An item can carry this source and a criticality designation at the same time. The lot records are the same records.")
  ],
  check:{q:"Specialized high-strength fasteners require heat and lot traceability. Which codes apply?",
   o:[
     "LOT",
     "LL and LOT",
     "SER and LOT",
     "LL only"],
   a:0, why:"The fasteners have no shelf life, so LL does not apply. Heat and lot traceability is a lot/batch recording requirement under process and batch conditions. LOT, with the long note text for a detail or vendor part. Nothing drives serialization."}},

 {id:"M3-04", gov:["R_COUNTERFEIT"], title:"Counterfeit avoidance for electronic parts", body:[
    P("Counterfeit avoidance drives lot/batch traceability on electronic parts. It is a contract requirement, not a design requirement. It applies when the contract includes either of two clauses:"),
    L([
      "**DFARS 252.246-7007**, Contractor Counterfeit Electronic Part Detection and Avoidance System.",
      "**DFARS 252.246-7008**, Sources of Electronic Parts."]),
    C("Definition, DFARS 252.246-7007", [
      "**Electronic part** means “an integrated circuit, a discrete electronic component (including, but not limited to, a transistor, capacitor, resistor, or diode), or a circuit assembly.”"]),
    P("The definition is broad. It reaches ordinary passive components, not only microcircuits. A resistor is an electronic part."),
    P("Both clauses state the traceability requirement the same way. The contractor keeps risk-based processes that let it track electronic parts from the original manufacturer to product acceptance by the Government. That holds whether the parts arrive as discrete parts or inside assemblies."),
    P("DFARS 252.246-7008 sets the sourcing order:"),
    STEPS([
      {h:"The original manufacturer, or its authorized suppliers", b:"Or suppliers that obtain the parts only from the original manufacturer or its authorized suppliers."},
      {h:"A contractor-approved supplier", b:"Only when the part is not available from the first tier. The contractor then takes responsibility for authenticity, and for inspection, testing, and authentication under the applicable industry standards."}]),
    P("Two SAE standards are commonly invoked. SAE AS5553 covers counterfeit avoidance, detection, mitigation, and disposition for organizations that buy and integrate electronic parts. SAE AS6081 covers the same ground for distributors."),
    S("Where traceability cannot be established, inspection, testing, and authentication replace it.",
      "That substitution is expensive. The lot and source record is the cheaper path.")
  ],
  check:{q:"A contract includes DFARS 252.246-7008. A buyer wants to source a resistor from an independent distributor with no link to the original manufacturer, because it is not a microcircuit. What is wrong?",
   o:[
     "A resistor is an electronic part, so the sourcing order and traceability apply",
     "Nothing. The clauses apply only to integrated circuits",
     "Nothing, provided the resistor is serialized and inspected at receiving",
     "The clause bans independent distributors under all conditions"],
   a:0, why:"The DFARS definition names discrete components, including resistors. The sourcing order puts the original manufacturer and its authorized suppliers first. A contractor-approved supplier may be used only when the part is not available from those sources, and then the contractor owns authentication. Serialization does not answer a source question."}},

 {id:"M3-05", gov:["R_COUNTERFEIT"], title:"Which source, and which lot", body:[
    P("Counterfeit avoidance is commonly mistaken for a serialization requirement. It is not one."),
    CARDS([
      {h:"Serialization records", b:"Which unit. Where that unit is installed."},
      {h:"Counterfeit avoidance records", b:"Which source. Which lot. The chain back to the original component manufacturer."}], 2),
    P("The record structure is lot/batch with a source chain. The obligation is to trace a part back to the company that made it. A serial number applied at receiving says nothing about where the part came from."),
    P("An electronic part can carry this source and a shelf-life source at the same time. Electronic components, microchips, capacitors, and diodes appear in both lists. One LOT code satisfies both. The reasons differ. The lot records are the same records."),
    P("A counterfeit-controlled electronic part takes LOT. If it also has a shelf-life limit, it takes LL and LOT.")
  ],
  check:{q:"A capacitor is bought under DFARS 252.246-7007 and has a shelf-life limit on its lot. Which codes does it take?",
   o:[
     "LL and LOT",
     "SER and LOT, one identity for each source",
     "LOT only, because the shelf life is covered by counterfeit control",
     "SER and LL, because counterfeit control needs a serial number"],
   a:0, why:"Both sources need lot/batch recording, and one LOT covers both. The shelf-life limit adds LL with the age and shelf-life note text. Counterfeit avoidance traces source and lot. It does not call for a serial number."}},

 {id:"M3-06", gov:["R_SH"], title:"Special Handling Required", body:[
    P("Special Handling Required items are Lot/Batch Recording Required items. Manufacturing and Production must follow special handling and packaging methods when storing and working with them."),
    P("They include sensitive electronic parts or assemblies, fragile equipment, easily lost parts of high value, perishable items, and items that must be stored under specific environmental or security conditions."),
    P("Special handling, packaging, and environmental control may be required when critical limits exist for any of these factors:"),
    CARDS([
      {h:"Environment", b:"Atmospheric pressure. Fungus. Hail. Humidity. Rain. Salt spray. Sand and dust. Solar radiation. Temperature. Wind."},
      {h:"Physical and electrical", b:"Shock. Vibration. Electrostatic discharge sensitive. Sensitive electronic devices."},
      {h:"Material, life, and security", b:"Life limits, including expiration dates. Hazardous material. Security classification."}]),
    P("The special handling conditions, including segregation and packaging, are recorded as a lot. That is why SH always travels with LOT."),
    P("Parts lists containing these items must specify the handling, packaging, or environmental requirements. Parts lists that call out off-the-shelf purchased items must identify the special requirements for those items too. An off-the-shelf part does not arrive with the requirement attached.")
  ],
  check:{q:"A parts list calls out an off-the-shelf humidity-sensitive sensor. The engineer omits SH, reasoning that the vendor's datasheet covers storage. What is wrong?",
   o:[
     "Parts lists must identify special requirements for off-the-shelf items too",
     "Nothing. The vendor datasheet satisfies the requirement",
     "Only the LOT code is missing, because SH does not apply to purchased items",
     "SH is needed only if the sensor is also a Critical Safety Item"],
   a:0, why:"The parts list is the instruction the build environment reads. A datasheet in a vendor's file is not. Parts lists that call out off-the-shelf purchased items must identify the special requirements for those items. The sensor takes SH with the handling stated, and LOT, because the handling conditions are recorded as a lot."}},

 {id:"M3-07", gov:["R_SH_NOTE"], title:"Writing the special handling note", body:[
    P("For items requiring special handling, apply both notes:"),
    NOTE("LOT_L"),
    NOTE("SH"),
    P("The bracketed field is where the work is. State the control, or reference the specification that states it. Write it so a technician at a bench can act on it without looking anything else up, or can find the specification that tells them."),
    P("Three examples:"),
    NOTE("SH_EX1"),
    NOTE("SH_EX2"),
    NOTE("SH_EX3"),
    C("Watch for cancelled standards in older notes", [
      "Older ESD notes cite MIL-STD-1686 and DOD-HDBK-263. MIL-STD-1686C was cancelled on 12 January 2021. The cancellation notice names ANSI/ESD S20.20 as its replacement.",
      "When you revise a parts list that carries an older ESD note, bring the reference current. A note that points at a cancelled standard sends the reader to a document nobody maintains."], "teal")
  ],
  check:{q:"Which special handling note text does its job?",
   o:[
     "SPECIAL HANDLING REQUIRED – TEMPERATURE SHALL BE KEPT BETWEEN 33°F AND 150°F DURING SHIPMENT AND INSTALLATION.",
     "SPECIAL HANDLING REQUIRED – HANDLE WITH CARE.",
     "SPECIAL HANDLING REQUIRED – SEE VENDOR.",
     "SPECIAL HANDLING REQUIRED."],
   a:0, why:"The note must state the handling, packaging, or environmental control required, or reference the specification that contains it. Only the first does. “Handle with care” states no control. “See vendor” names no document. A bare heading gives the build environment nothing to follow."}},

 {id:"M3-08", gov:["R_EXPLOSIVE"], title:"Explosive material", body:[
    P("Explosive materials include, but are not limited to, ammunition, pyrotechnics, destructors, detonators, initiators, thrusters, JATO units, fuels, catapults, and explosive units. The category includes solids, liquids, and gases."),
    P("Before releasing any data, coordinate the use of these materials with the Materials and Processes organization under existing operating procedures. Do the same for any material suspected of being explosive."),
    P("For explosive material items, apply:"),
    NOTE("LOT_L"),
    NOTE("SH_EXP"),
    P("The explosive material note text goes on the drawing picture sheet as well. If that is not practicable, the picture sheet carries a reference to it. The note, or a reference to it, is required on the drawing picture sheet and on **all higher-level drawings**."),
    S("Explosive material is the one condition that must be visible at every level above it.",
      "Someone working on the top assembly needs to know what is inside it."),
    C("Beryllium is not explosive", [
      "Beryllium and beryllium alloys are toxic hazardous materials. They are not explosive materials. Treat them as Special Handling Required items under the hazardous material factor, with SH and LOT."])
  ],
  check:{q:"A thruster cartridge is installed in a canopy jettison assembly, which goes into the cockpit installation. Where must the explosive material note, or a reference to it, appear?",
   o:[
     "On the cartridge's drawing picture sheet and on all higher-level drawings",
     "On the cartridge's parts list line only, next to the LOT note",
     "On the cartridge drawing and the next-higher assembly only",
     "On the end item drawing only, where the whole system is shown"],
   a:0, why:"The explosive material note, or a reference to it, is required on the drawing picture sheet and on all higher-level drawings. That puts the warning in front of anyone working at any level above the explosive item. The SER and TR climb is a separate rule, and it also applies here because the cartridge carries LOT."}},

 {id:"M3-09", gov:["R_RADIOACTIVE"], title:"Radioactive material", body:[
    P("Radioactive materials are items that Radiation Health Protection has identified as radioactive beyond tolerable limits."),
    P("For radioactive material items, apply:"),
    NOTE("LOT_L"),
    NOTE("SH_RAD"),
    P("The note must name the isotope and the amount of radioactivity. A warning without the isotope and the curies is not enough for Radiation Health Protection to act on."),
    P("The note is required on the lowest-level drawing that calls for the radioactive material. It is required on higher-level drawings when Radiation Health Protection requests it."),
    TABLE(["", "Explosive material", "Radioactive material"], [
      ["Codes", "SH, LOT", "SH, LOT"],
      ["Who decides it applies", "Coordinate with Materials and Processes", "Radiation Health Protection identifies it"],
      ["Note must include", "Handling method and safety precautions", "Isotope and number of curies"],
      ["Higher-level drawings", "Always, note or reference", "When Radiation Health Protection requests it"]])
  ],
  check:{q:"A radioactive source is called out on a detail drawing. Radiation Health Protection has not asked for the note on higher assemblies. Where is the note required?",
   o:[
     "On the lowest-level drawing that calls for the material",
     "On every higher-level drawing up to the end item",
     "On the end item drawing only, as the top-level record",
     "Nowhere, until Radiation Health Protection requests it"],
   a:0, why:"The radioactive material note is required on the lowest-level drawing that calls for the material. Higher-level drawings carry it when Radiation Health Protection requests it. That differs from explosive material, where every higher-level drawing carries the note or a reference to it."}}
 ],
 drill:[
  {id:"M3-L1", find:"11", pn:"EX-3340-900", nm:"CASTING, HOUSING, NON-CRITICAL",

 exercises:[

   scen:"A program's contract includes DFARS 252.246-7007 and 252.246-7008. A circuit card assembly uses microcircuits, ceramic capacitors, film resistors, and tantalum capacitors with a shelf-life limit. One microcircuit is obsolete and unavailable from the original manufacturer or its authorized distributors. The buyer finds stock at an independent distributor.",
   parts:[
    {id:"a", q:"Which items on the card fall under the counterfeit avoidance clauses? Explain using the definition."},
