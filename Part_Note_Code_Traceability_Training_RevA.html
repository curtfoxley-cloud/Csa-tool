<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part Note Codes and Traceability</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.tbtn.danger{border-color:#7A4A3A;color:#EBCDC2}
.tbtn.danger:hover{background:#4A2E26;border-color:#A85D45}
.tbtn.danger.armed{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 6px}
  .hero .subtitle{font-family:var(--serif);font-size:19px;line-height:1.3;color:#C9D3D9;margin:0 0 10px}
  .hero .scale{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust-soft);margin:0 0 14px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .who input{width:100%;min-width:0}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}

/* ---------- part note text ---------- */
.pnote{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--teal);
  border-radius:5px;padding:10px 14px;margin:0 0 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.pnote .pc{flex:0 0 auto;min-width:44px;text-align:center;background:var(--ink);color:#fff;font-weight:700;border-radius:3px;padding:1px 7px;font-size:11.5px;letter-spacing:.04em;margin-top:1px}

/* ---------- product tree ---------- */
.tree{border:1px solid var(--rule);border-radius:6px;background:var(--paper);margin:0 0 20px;overflow:hidden}
.trow{display:flex;gap:12px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--rule);font-size:13.5px}
.trow:first-child{border-top:0}
.trow .tn{flex:1;min-width:0;color:var(--ink-2)}
.trow .tn b{color:var(--ink)}
.trow .tn i{display:block;font-style:normal;font-size:12.5px;color:var(--slate);margin-top:2px}
.trow .tc{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.chip.none{font-weight:400;color:var(--mute)}
.tbar{font-family:var(--mono);color:var(--mute);white-space:pre}

/* ---------- parts-list drill ---------- */
.dline{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;margin:0 0 18px;overflow:hidden}
.dline .hd{background:var(--surface-2);padding:9px 16px;border-bottom:1px solid var(--rule);display:flex;gap:8px 18px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.dline .hd span b{color:var(--slate);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-right:6px}
.dline .bd{padding:14px 16px 16px}
.dline .nm{font-family:var(--mono);font-size:14px;font-weight:700;margin:0 0 10px;letter-spacing:.02em}
.codes{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 0}
.code{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:4px;padding:6px 11px;
  font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;background:var(--paper);user-select:none}
.code:hover{background:var(--surface)}
.code input{accent-color:var(--rust);margin:0}
.code.none{font-weight:400}
.code.locked{cursor:default}
.code.locked:hover{background:inherit}
.code.right{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.code.wrong{border-color:var(--alert);background:var(--alert-soft);color:var(--alert);text-decoration:line-through}
.code.missed{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);border-style:dashed}
.legend{font-size:12.5px;color:var(--slate);margin:10px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid}
.legend .lr{background:var(--teal-soft);border-color:var(--teal)}
.legend .lw{background:var(--alert-soft);border-color:var(--alert)}
.legend .lm{background:var(--amber-soft);border-color:var(--amber);border-style:dashed}
</style>
</head>
<body>

<header class="top">
  <button class="tbtn railtoggle" id="railToggle" aria-label="Show section register">Sections</button>
  <div class="brand">
    <b>Part Note Codes and Traceability Training</b>
    <span id="brandSub">Interactive modules</span>
  </div>
  <div class="spacer"></div>
  <div class="who">
    <label for="who">Trainee</label>
    <input id="who" type="text" placeholder="Your name" autocomplete="name">
  </div>
  <button class="tbtn" id="btnSave">Save<span class="lng"> progress</span></button>
  <button class="tbtn" id="btnLoad">Resume</button>
  <button class="tbtn danger" id="btnClear" title="Erase every answer, check, and the trainee name">Clear<span class="lng"> all</span></button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Section register"></nav>
  <main><div class="stage" id="stage"></div></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   TRAINER SETUP: edit this block, save the file, then share it.
   Nothing else in this file needs changing.
   ========================================================================== */
var CONFIG = {
  companyName:   "[Company]",
  trainerName:   "your trainer",
  trainerEmail:  "",            // e.g. "cm.lead@company.com": enables the Email results button
  submitEndpoint:"",            // optional: a URL that accepts a JSON POST (Power Automate, Forms webhook, etc.)

  /* ---- content currency: update these two whenever you revise the content ---- */
  contentRev:    "A",           // revision of this training file
  alignedTo:     "Part note codes for traceable parts and product-unit records requiring configuration status accounting reconciliation. Regulatory text for 14 CFR 43.10, 45.15, and 45.16 checked against the eCFR on 2026-09-23. The special handling ESD example cites ANSI/ESD S20.20, because MIL-STD-1686C was cancelled on 12 January 2021 and superseded by ANSI/ESD S20.20. Checked 2026-09-23",

  /* ---- trainer view ----
     The source map lists every section against the rule it restates. Set this true
     to show it, or leave it false and open the file with #trainer on the end of the
     address to show it for one sitting. Trainees do not need it. */
  trainerView:   false
};

/* ==========================================================================
   SOURCE MAP

   Every section restates a rule that is owned somewhere else. When an owning
   rule changes, the sections that restate it have to be checked, and so do the
   parts-list drill lines in the same module.

   These keys name the RULE, never a document title and never a paragraph
   number. To find what a rule change affects, look the rule up on the trainer
   source map page, or search this file for its key.
   ========================================================================== */
var RULES = {
  R_PURPOSE:         "What part traceability records are for",
  R_ROLES:           "Who imposes the codes, who captures the records, who reconciles them",
  R_CODES:           "The eight part note codes and what each one drives",
  R_IDENTITY_CONDITION:"Identity codes, the linkage code, and condition codes",
  R_SER_VS_LOT:      "Serial number versus lot/batch number",
  R_CASCADE:         "Serialization and traceability records are maintained up the product tree to the end item",
  R_STACKING:        "Codes stack: every source, every code",
  R_NOTE_FORMS:      "Long and short note texts for SER, LOT, and TR",

  R_SER_SOURCES:     "The sources that drive serialization",
  R_ALI:             "Airworthiness Limitation Items and 14 CFR 45.15(c)",
  R_ALI_QUESTIONS:   "The three questions that set the codes for an ALI",
  R_ALI_CALENDAR:    "Calendar-limited ALIs and parts too small to mark",
  R_ALI_LOT:         "ALS limits on a lot, and the separate shelf-life regime",
  R_PSE:             "Safe-life Principal Structural Elements",
  R_PSE_DT:          "Damage-tolerant PSEs and PSE constituent materials",
  R_PREMIUM:         "Premium selected materials and elevated design values",

  R_LOT_SOURCES:     "The sources that drive lot/batch recording",

{
 id:"M1", label:"Module 1", title:"The codes and the rule", sub:"Why part traceability exists, who does what, the eight part note codes, identity versus condition, and the rule that carries records to the end item",
 sections:[
 {id:"M1-01", gov:["R_PURPOSE"], title:"Why part traceability exists", body:[
    P("A turbine disk cracks in service. The investigation traces the crack to an inclusion in the forging. The next question is simple. Which other disks came from that heat of material, and which aircraft are they on?"),
    P("Part traceability records answer that question. Without them, the answer is every disk in the fleet."),
    P("Two identifiers do the work. A **serial number** says which unit. A **lot/batch number** says which group of units shared a material, a process run, or a test. A traceability record then ties each unit to the assembly it went into."),
    S("Traceability turns a fleet-wide problem into a list of tail numbers.",
      "The list is only as good as the records behind it. One missing link breaks the chain at that point, and everything above the break is unknown."),
    P("These are **product-unit records**. They describe individual units and lots as built. The design says what each item must be. The product-unit records say what each delivered unit actually contains."),
    C("The same records serve more than recalls", [
      "Remaining life is counted per unit, so a life-limited part without a serial number cannot be retired on time.",
      "A test result that qualifies one part must stay with that part. A suspect lot from a supplier must be found wherever it went.",
      "Each of these needs the same thing: an identifier on the item, and a record of where the item went."])
  ],
  check:{q:"A forging supplier reports that one heat of titanium had a chemistry nonconformance. What do part traceability records let the program do?",
   o:[
     "Identify the units made from that heat and the assemblies they went into",
     "Show that the heat met specification, since it passed receiving inspection",
     "Replace the material design values for that alloy across all programs",
     "Nothing until the drawing is revised to call out a different heat"],
   a:0, why:"Traceability records connect a heat or lot to specific units, and each unit to its parent assembly. That turns a supplier escape into a bounded list of affected hardware. Receiving inspection passed the material before the problem was known, so it proves nothing now. The design is not at fault, so a drawing change does not find a single suspect part."}},

 {id:"M1-02", gov:["R_ROLES"], title:"Who does what", body:[
    P("Three organizations share this work. Each one owns a different piece."),
    TABLE(["Organization", "Owns", "Output"], [
      ["Design Engineering", "Imposing the requirement", "Part note codes and note texts on the parts list"],
      ["Manufacturing and Production (the build environment)", "Capturing the records", "Serial numbers, lot/batch numbers, marks, and parent-child traceability records"],
      ["Configuration Management", "Reconciling the two", "Confirmation that every code on the design has matching records from the build environment"]]),
    P("Configuration Management does the reconciliation as part of **configuration status accounting**. The design is one side of the comparison. The build records are the other."),
    P("The part note code is the handoff between the three. If Design Engineering does not apply the code, the build environment has no instruction to capture the record. If the build environment does not capture the record, Configuration Management finds the gap at reconciliation. By then the unit may already be delivered."),
    S("A traceability requirement that never reaches the parts list never reaches the shop floor."),
    C("For non-engineers", [
      "You do not need to write part notes to use this course. Buyers flow the requirement to suppliers. Planners build it into work instructions. Inspectors verify the mark and the record. Technicians record the number at installation.",
      "Every one of those actions starts from a part note code on a parts list. Knowing what the code means tells you what your step owes."], "teal")
  ],
  check:{q:"An engineer knows a bracket is a Fracture-Critical Traceable Part but leaves the codes off the parts list, planning to tell Manufacturing directly. What goes wrong?",
   o:[
     "The build environment has no design instruction, and reconciliation has nothing to check",
     "Nothing, provided Manufacturing records the serial numbers anyway",
     "Only a drafting error, which the checker corrects at the next drawing revision cycle",
     "Configuration Management adds the missing codes during reconciliation"],
   a:0, why:"The part note code is both the instruction and the reconciliation baseline. A verbal instruction does not survive a shift change, a new supplier, or a reorder. Configuration Management reconciles the codes on the design against the records. It does not author the codes. Design Engineering does."}},

 {id:"M1-03", gov:["R_CODES"], title:"The eight part note codes", body:[
    P("Eight part note codes carry part traceability and product-unit record requirements. Learn each one by what it drives."),
    TABLE(["Code", "Name", "What the code drives"], [
      ["SER", "Serialization Recording Required", "Record serial numbers, or apply and record serial numbers"],
      ["LOT", "Lot/Batch Recording Required", "Record lot/batch numbers, or apply and record lot/batch numbers"],
      ["TR", "Traceability Records Required", "Generate the parent-child traceability records of items in the product tree"],
      ["IUID", "Item Unique Identification Required", "Mark the item with a unique item identifier and report it to the DoD IUID Registry"],
      ["LL", "Life Limited", "Identify the item as life-limited and state its limit"],
      ["SH", "Special Handling Required", "State the handling, packaging, or environmental control required"],
      ["CSI", "Critical Safety Item", "Identify the item as a Critical Safety Item"],
      ["FC", "Fracture-Critical Item", "Identify the item as a Fracture-Critical Traceable Part or a Fracture-Critical Part"]]),
    P("A part note code never travels alone. It goes on the parts list with its **note text**. The code is the short handle. The note text is the instruction the build environment reads."),
    P("Here is one, as it appears on a parts list:"),
    NOTE("SER_L"),
    P("The rest of this course teaches which items take which codes, and why.")
  ],
  check:{q:"Which part note code directs the build environment to generate records linking each item to its parent in the product tree?",
   o:[
     "TR",
     "SER",
     "LOT",
     "IUID"],
   a:0, why:"TR, Traceability Records Required, generates the parent-child records. SER and LOT give a unit or a lot its identity. IUID adds a machine-readable unique item identifier and a registry report. None of those three links an item to its parent. TR does."}},

 {id:"M1-04", gov:["R_IDENTITY_CONDITION"], title:"Identity codes and condition codes", body:[
    P("The eight codes do three different jobs."),
    CARDS([
      {h:"Identity: SER, LOT, IUID", b:"These give a unit or a lot an identifier that the build environment records."},
      {h:"Linkage: TR", b:"This links those identities into parent-child records up the product tree."},
      {h:"Condition: LL, SH, CSI, FC", b:"These identify a condition of the item. They do not create records on their own."}]),
    P("Take two life-limited items. A landing gear shock strut is limited by landing cycles. Each strut counts its own cycles, so each strut needs its own serial number. It takes LL and SER."),
    P("An O-ring is limited by shelf life. The limit attaches to the manufacturing batch, so the batch is what gets recorded. It takes LL and LOT."),
    P("Both items carry LL. LL says the item has a life limit. It does not say how the build environment will know which strut or which batch it holds. The identity code says that."),
    S("A condition code always needs an identity code beside it.",
      "The requirement source decides which identity code. LL never decides it.")
  ],
  check:{q:"A designer applies LL to a new part and nothing else. What is missing?",
   o:[
     "An identity code, SER or LOT, set by the requirement source",
     "Nothing. LL creates the life-tracking records on its own",
     "TR, because every life-limited item needs parent-child records",
     "CSI, because every life-limited part is a Critical Safety Item"],
   a:0, why:"LL is a condition code. It identifies the item as life-limited and states the limit. It creates no record. The requirement source decides whether the limit is tracked per unit, with SER, or per lot, with LOT. TR follows from SER or LOT on a child, not from LL. Most life-limited parts are not Critical Safety Items."}},

 {id:"M1-05", gov:["R_SER_VS_LOT"], title:"Which unit, or which lot", body:[
    P("A serial number and a lot/batch number answer different questions."),
    CARDS([
      {h:"Serial number", b:"Which unit. One identifier belongs to one physical item. Use it when the thing that matters is per unit: remaining life, one specimen test result, a mandatory mark."},
      {h:"Lot/batch number", b:"Which group. One identifier covers every item made from the same material, process run, or test sample. Use it when the property that matters is shared: a heat of metal, a cure batch, a shelf-life date, a source of supply."}], 2),
    P("Neither one substitutes for the other. A lot number cannot say where one specific item went. A serial number cannot say which heat of material an item came from unless the lot is also recorded."),
    P("Some items need both. A premium selected material part needs a serial number to tie each test result to one part. It also needs a lot/batch record for heat traceability."),
    C("The location gap", [
      "A lot number alone does not establish location. Fifty O-rings from one batch may go into fifty different assemblies. The lot record says what they share. It does not say where each one went.",
      "That is why the **parent** of a lot/batch recorded item is serialized. The parent's serial number is the location. The lot record attaches to it."])
  ],
  check:{q:"Why is the parent of a Lot/Batch Recording Required item serialized?",
   o:[
     "A lot number does not establish location, so the lot must attach to an identified unit",
     "Lot/batch numbers expire with the shelf life of the lot, and serial numbers never do",
     "Serial numbers are cheaper for the build environment to record than lot numbers",
     "The parent inherits the lot number and needs a serial number to carry it"],
   a:0, why:"One lot can be spread across many assemblies. To find where a suspect lot went, each assembly that received part of it must be individually identified. The parent's serial number is that identifier. The lot record then attaches to a known unit."}},

 {id:"M1-06", gov:["R_CASCADE"], title:"The governing rule", body:[
    P("One rule governs every item that carries SER or LOT."),
    S("When an item holds a serialization recording requirement or a lot/batch recording requirement, serialization and traceability records must be maintained up the product tree to the end item.",
      "This is a company directive. It applies whatever the requirement source. There is no threshold and no shorter scope."),
    P("The rule has three consequences."),
    L([
      "**Every physical parent is serialized.** The item's next-higher physical parent is serialized. So is every higher physical parent below the end item.",
      "**Every physical parent generates traceability records.** Each record links an item to its next-higher parent.",
      "**The chain stops at the end item.** The end item is the top-level asset or system under contract. It is typically the complete aircraft, by tail number, or the missile system."]),
    P("The end item is not a Line Replaceable Unit (LRU). An LRU is removed and replaced on the flight line. The chain does not stop there. It continues to the aircraft or system the LRU is installed in."),
    P("Module 4 walks the climb one level at a time. For now, hold the rule.")
  ],
  check:{q:"A serialized valve goes into a manifold. The manifold goes into a Line Replaceable Unit, and the LRU goes into an aircraft. Where do the serialization and traceability records stop?",
   o:[
     "At the aircraft, the end item under contract",
     "At the LRU, since it is the replaceable unit",
     "At the manifold, the valve's next-higher parent",
     "At the valve, since only the valve holds its own requirement"],
   a:0, why:"The records climb to the end item. The end item is the top-level asset or system under contract, typically the aircraft by tail number or the missile system. An LRU is not the end item. Stopping at the manifold or the LRU leaves the question “which aircraft?” unanswered."}},

 {id:"M1-07", gov:["R_STACKING"], title:"Codes stack", body:[
    P("Requirement sources and codes do not map one to one."),
    P("**One source can drive several codes.** A Critical Safety Item takes CSI, SER, LOT, and IUID. Each code does a different job."),
    P("**Several sources can drive one code.** A capacitor may carry a shelf-life limit. It may also fall under a counterfeit avoidance clause in the contract. Both sources call for lot/batch recording. One LOT code satisfies both. The reasons differ. The lot records are the same records."),
    P("**Several sources can land on one item.** A part listed in the Airworthiness Limitations Section may also be a Fracture-Critical Traceable Part and a premium selected material part. Apply every code that each source drives. Do not stop at the first source you find."),
    STEPS([
      {h:"Find every source", b:"Ask what regulation, contract clause, designation, or physical condition applies to the item. There may be more than one."},
      {h:"Apply every code each source drives", b:"Do not duplicate a code. One LOT covers every source that needs lot/batch records."},
      {h:"Apply the climb", b:"Once the item carries SER or LOT, every physical parent below the end item takes SER and TR."}])
  ],
  check:{q:"An electronic part has a shelf-life limit and is bought under a contract with a counterfeit avoidance clause. How many LOT codes does it take?",
   o:[
     "One, because both sources are satisfied by the same lot records",
     "Two, one for each requirement source",
     "None, because counterfeit avoidance requires serialization instead",
     "One LOT and one SER, because two sources need two identities"],
   a:0, why:"A code drives an action: record the lot/batch number. Both sources need that same action. One LOT code covers both, with LL beside it for the shelf life. Counterfeit avoidance traces the source and the lot. It is not a serialization requirement."}},

 {id:"M1-08", gov:["R_NOTE_FORMS"], title:"Long and short note texts", body:[
    P("SER and LOT each have a long note text and a short one. The choice depends on why the item carries the code."),
    P("An item that holds **its own** serialization recording requirement takes the long SER text:"),
    NOTE("SER_L"),
    P("If that item also has children that carry SER or LOT, it also takes:"),
    NOTE("TR_S"),
    P("A physical parent that carries SER **only because of the climb** takes the short texts:"),
    NOTE("SER_S"),
    NOTE("TR_S"),
    P("LOT follows the same logic. A raw material callout, such as bar stock, sheet, plate, or bulk sealant, takes the short text:"),
    NOTE("LOT_S"),
    P("A detail part or a vendor part that holds a lot/batch recording requirement takes the long text:"),
    NOTE("LOT_L"),
    P("The long texts carry the climb inside the note. They tell the build environment that traceability runs from this item to the end item.")
  ],
  check:{q:"An assembly has no traceability requirement of its own. One of its children is a serialized life-limited actuator. Which codes does the assembly take?",
   o:[
     "SER and TR, with the short note texts",
     "SER with the long note text, and no TR",
     "TR only, since the assembly holds no requirement of its own",
     "LL and SER, inherited from the actuator"],
   a:0, why:"The assembly is a physical parent of a serialized item. The climb requires it to be serialized and to generate traceability records, so it takes SER and TR in their short forms. The long SER text is for an item holding its own serialization requirement. Condition codes such as LL do not flow up the product tree."}}
