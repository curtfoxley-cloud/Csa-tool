{
 id:"M4", label:"Module 4", title:"The climb to the end item, and IUID", sub:"How traceability records run from a traceable item up every physical parent to the end item, how installation drawings and the end item are coded, and when Item Unique Identification applies, how it is marked, and how it is reported",
 sections:[
 {id:"M4-01", gov:["R_TR"], title:"What the TR code directs", body:[
    P("SER and LOT give an item an identity. TR puts that identity somewhere."),
    P("The Traceability Records Required code, TR, directs the build environment to generate part traceability records. These records document where each Serialization Recording Required item and each Lot/Batch Recording Required item is installed."),
    S("Each traceability record links an item to its next-higher parent.",
      "String the records together and they answer the question the whole system exists to answer: this part, in which aircraft?"),
    P("A link has to identify both ends. On one end, the child's part number with its serial number or lot/batch number. On the other end, the parent's part number and serial number."),
    P("One link is not enough. A record that says “valve serial 0412 is in manifold serial 0031” is useless if nobody knows where manifold 0031 went. The next link says that. So does the one after it, all the way to the end item."),
    C("TR belongs on the parent", [
      "TR goes on the item whose parts list holds traceable children. It tells the build environment to record which child went into this unit.",
      "An item with no traceable children has nothing to link below it. It does not take TR, even if it carries SER itself."])
  ],
  check:{q:"A serialized relief valve has no children. Does the valve itself take TR?",
   o:[
     "No. TR goes on the parent whose children carry SER or LOT",
     "Yes. Every serialized item takes TR",
     "Yes, because the long SER note requires traceability",
     "No, because a valve with no children is not a traceable item at all"],
   a:0, why:"TR directs the generation of records that link children to this item. The valve has no children, so there is nothing to link below it. Its own link, to its parent, is generated by the TR on the parent. The long SER note tells the build environment the chain runs to the end item, but TR still belongs on the parent."}},

 {id:"M4-02", gov:["R_PARENTS","R_CASCADE"], title:"Every physical parent", body:[
    P("Recall the governing rule. When an item holds a serialization recording requirement or a lot/batch recording requirement, serialization and traceability records must be maintained up the product tree to the end item."),
    P("Here is what that means for the parents. A serialized item's next-higher physical parent must also be serialized. So must every higher physical parent below the end item. The parent of a lot/batch recorded item is serialized too, because a lot number alone does not establish location."),
    P("For each physical parent below the end item, apply:"),
    NOTE("SER_S"),
    NOTE("TR_S"),
    S("There is no threshold and no shorter scope.",
      "The rule does not ask how critical the child is, how cheap the parent is, or how deep the tree runs. One traceable item at the bottom serializes every physical parent above it."),
    P("Notice the word **physical**. The rule applies to items that are consumed into the product as parts. Two kinds of item in a product tree are not physical parts: installation drawings and the end item itself. The next section covers both.")
  ],
  check:{q:"A lot-recorded O-ring sits five levels below the aircraft. None of the four assemblies between them holds a requirement of its own. How many of those assemblies take SER and TR?",
   o:[
     "All four physical parents below the end item",
     "Only the O-ring's next-higher assembly",
     "None, because a lot-recorded child does not drive serialization of its parent",
     "Only the assemblies that are Line Replaceable Units"],
   a:0, why:"The parent of a lot/batch recorded item is serialized, because a lot number does not establish location. The rule then continues: every higher physical parent below the end item is serialized and generates traceability records. There is no threshold and no stopping at an LRU."}},

 {id:"M4-03", gov:["R_INSTALL_END"], title:"Installation drawings and the end item", body:[
    P("Two items in the product tree break the pattern."),
    P("**Installation drawings.** An installation drawing depicts installation instructions. It is not consumed into the production system as a physical part. You cannot serialize an instruction. For each installation drawing that sits between a traceable item and the end item, apply:"),
    NOTE("TR_INST"),
    P("The installation drawing takes TR and no SER. The chain passes through it and reaches the next physical item or the end item."),
    P("**The end item.** The end item is the top-level asset or system under contract. It is typically the complete aircraft, by tail number, or the missile system. For the end item, apply:"),
    NOTE("TR_END"),
    P("The end item does not take SER. The contract assigns its identity: a tail number or a system serial number. When the contract requires IUID for the end item, apply the IUID code as well."),
    TABLE(["Item in the tree", "Codes", "Note text"], [
      ["Physical parent below the end item", "SER, TR", "Short SER and short TR"],
      ["Installation drawing between a traceable item and the end item", "TR", "Installation TR text"],
      ["End item", "TR, and IUID if the contract requires it", "Terminator TR text"]])
  ],
  check:{q:"A flap installation drawing sits between a serialized flap drive unit and the aircraft. Which codes does the installation drawing take?",
   o:[
     "TR, with the installation note text",
     "SER and TR, like any other parent",
     "No code, because installation drawings are not parts",
     "TR, with the terminator note text"],
   a:0, why:"An installation drawing is not a physical part, so it takes no SER. The chain still passes through it, so it takes TR with the installation note text. The terminator text belongs only on the end item."}},

 {id:"M4-04", gov:["R_PARENTS","R_INSTALL_END"], title:"A worked climb", body:[
    P("Walk one tree from the bottom up. An actuator sits inside a flap drive unit. The flap drive unit is installed on the aircraft through a flap installation drawing."),
    TREE([
      [0, "Aircraft, tail number assigned by contract", ["TR"], "End item. Terminator TR text. No SER. IUID only if the contract requires it."],
      [1, "Flap installation", ["TR"], "Installation drawing. Installation TR text."],
      [2, "Flap drive unit", ["SER","TR"], "A Line Replaceable Unit. Physical parent. Short texts. The chain does not stop here."],
      [3, "Actuator assembly", ["SER","TR"], "Physical parent of traceable children. Short texts."],
      [4, "Housing, Fracture-Critical Traceable Part", ["FC","SER","LOT"], "Holds its own requirements. Long SER and long LOT texts."],
      [4, "O-ring set, shelf-life limited", ["LL","LOT"], "Age and shelf-life LL text. Long LOT text."],
      [4, "Fasteners, heat and lot traceability", ["LOT"], "Long LOT text. No LL: fasteners have no shelf life."],
      [4, "End cap", [], "No source applies. No code."]]),
    STEPS([
      {h:"Code the children from their own sources", b:"The housing, the O-rings, and the fasteners each carry codes from their own requirement sources. The end cap carries none."},
      {h:"Climb one level", b:"The actuator has traceable children. It takes SER and TR."},
      {h:"Keep climbing through every physical parent", b:"The flap drive unit is a physical parent of a serialized actuator. SER and TR. Being an LRU changes nothing."},
      {h:"Pass through the installation drawing", b:"TR with the installation text. No SER."},
      {h:"Stop at the end item", b:"TR with the terminator text. The contract gives the aircraft its identity."}], "tl"),
    P("Notice what did not climb. FC stayed on the housing. LL stayed on the O-rings. Condition codes describe the item they sit on. Only SER and TR climb.")
  ],
  check:{q:"In the worked tree, why does the flap drive unit take SER and TR even though it holds no requirement of its own?",
   o:[
     "It is a physical parent of a serialized item, below the end item",
     "It is a Line Replaceable Unit, and every LRU is serialized",
     "It inherits the FC code from the fracture-critical housing inside it",
     "It is the end item for the actuator's records"],
   a:0, why:"The climb serializes every physical parent below the end item. The flap drive unit's serialized child is the actuator. Its status as an LRU is irrelevant, and it is not the end item. FC does not flow up the product tree."}},

 {id:"M4-05", gov:["R_IUID_CONTRACT"], title:"IUID is a contract requirement", body:[
    P("The Item Unique Identification Required code, IUID, drives two actions. Mark the item with a unique item identifier (UII). Report that UII to the Department of Defense IUID Registry."),
    P("IUID comes from the contract, not from the type design. It applies when the contract includes **DFARS 252.211-7003**, Item Unique Identification and Valuation."),
    L([
      "It does not apply to aircraft or subsystems delivered only under FAA certification, unless the contract requires it.",
      "When the prime contract requires IUID for an item that a supplier provides, the contractor flows DFARS 252.211-7003 down to that subcontract. That includes subcontracts for commercial products and commercial services."]),
    S("Every UII carries a serial number, so an IUID item is a serialized item.",
      "The UII adds two things a serial number alone does not: a machine-readable mark, and a registry record."),
    P("That is why the IUID code always travels with SER. And because SER is there, the climb to the end item applies.")
  ],
  check:{q:"A commercial transport airplane is delivered under FAA certification only. The contract has no DFARS clauses. A cycle-limited actuator on it costs $12,000. Does it take IUID?",
   o:[
     "No. IUID comes from DFARS 252.211-7003 in the contract, which is absent",
     "Yes. Any item with a unit cost over $5,000 takes IUID on any contract",
     "Yes. Every cycle-limited part takes IUID",
     "Only if the actuator is a Line Replaceable Unit removed on the flight line"],
   a:0, why:"IUID is a contract requirement. Without DFARS 252.211-7003, the value threshold never comes into play. The actuator still takes LL and SER from its cycle limit, and its parents still climb to the end item. It does not take IUID."}},

 {id:"M4-06", gov:["R_IUID_DEFS"], title:"IUID definitions", body:[
    P("DFARS 252.211-7003 defines the key terms. They are used as written."),
    C("DoD item unique identification", [
      "“a system of marking items delivered to DoD with unique item identifiers that have machine-readable data elements to distinguish an item from all other like and unlike items. For items that are serialized within the enterprise identifier, the unique item identifier shall include the data elements of the enterprise identifier and a unique serial number. For items that are serialized within the part, lot, or batch number within the enterprise identifier, the unique item identifier shall include the data elements of the enterprise identifier; the original part, lot, or batch number; and the serial number.”"]),
    C("Unique item identifier", [
      "“a set of data elements marked on items that is globally unique and unambiguous. The term includes a concatenated unique item identifier or a DoD recognized unique identification equivalent.”"]),
    C("Parent item", [
      "“the item assembly, intermediate component, or subassembly that has an embedded item with a unique item identifier or DoD recognized unique identification equivalent.”"]),
    P("Read the first definition for its data elements. There is always an **enterprise identifier**, which says who made or assigned the identity. There is always a **serial number**. Sometimes there is an **original part, lot, or batch number** in between. Every combination ends in a serial number."),
    P("“Like and unlike items” matters. The UII must be unique against every other item, not only against other items of the same part number. That is what “globally unique” means.")
  ],
  check:{q:"A UII built within a lot number contains which data elements?",
   o:[
     "The enterprise identifier, the original lot or batch number, and a serial number",
     "The enterprise identifier and the lot or batch number only",
     "The lot or batch number and the part number only",
     "The part number, the contract number, and the delivery order number"],
   a:0, why:"For items serialized within the part, lot, or batch number, the UII includes the enterprise identifier; the original part, lot, or batch number; and the serial number. A lot number without a serial number does not distinguish one item from another, so it cannot be a UII."}},

 {id:"M4-07", gov:["R_IUID_WHEN"], title:"When IUID applies", body:[
    P("DFARS 211.274-2(a) sets the policy. The contract identifies the items."),
    TABLE(["Category", "When IUID is required", "Authority"], [
      ["At or above the value threshold", "The Government’s unit acquisition cost is $5,000 or more. The contract line item sets the unit acquisition cost.", "DFARS 211.274-2(a)(1)"],
      ["Below the value threshold", "Unit acquisition cost under $5,000, when the requiring activity determines IUID is required for mission essential or controlled inventory items. The contract identifies them.", "DFARS 211.274-2(a)(2)"],
      ["DoD serially managed items", "Regardless of value. Includes embedded subassemblies, components, and parts. Embedded items are listed in the attachment called out by DFARS 252.211-7003(c)(1)(iii).", "DFARS 211.274-2(a)(3)(i)"],
      ["Parent items", "Regardless of value. At delivery the contractor reports the parent’s UII with the UII of each embedded item, per DFARS 252.211-7003(e).", "DFARS 211.274-2(a)(3)(ii)"],
      ["Warranted serialized items", "Regardless of value, for a serialized item delivered under a warranty.", "DFARS 211.274-2(a)(3)(iii)"],
      ["Special tooling and special test equipment", "Regardless of value, for a major defense acquisition program item designated for preservation and storage under section 815 of the FY2009 NDAA (Public Law 110-417).", "DFARS 211.274-2(a)(3)(iv)"],
      ["High risk items", "Regardless of value, when the requiring activity identifies the item as vulnerable to supply chain threat, a target of cyber threats, or susceptible to counterfeiting.", "DFARS 211.274-2(a)(3)(v)"]]),
    P("A **DoD serially managed item** is one the primary inventory control activity identifies as serially managed under DoDI 8320.04. These include capital asset equipment, Critical Safety Items, relocatable facilities, special test equipment and special tooling that is part of a major defense acquisition program, controlled inventory items as appropriate, and depot-level repairable items as determined by the item manager or the program manager. The requirement covers reparable and nonreparable items."),
    S("Value is only the first gate. Most of the list applies regardless of value.")
  ],
  check:{q:"A $900 depot-level repairable valve is identified by the item manager as serially managed. The contract includes DFARS 252.211-7003. Does it take IUID?",
   o:[
     "Yes. DoD serially managed items require IUID regardless of value",
     "No. It is below the $5,000 threshold",
     "Only if it is also a parent item",
     "Only if the design control activity also designates it a Critical Safety Item"],
   a:0, why:"DFARS 211.274-2(a)(3)(i) requires IUID for DoD serially managed items regardless of value. Depot-level repairable items determined by the item manager are among them. The valve takes IUID and SER."}},

 {id:"M4-08", gov:["R_IUID_MARK"], title:"Marking, construct, and reporting", body:[
    P("**Marking.** The build environment marks the UII data elements on the item. The mark is a two-dimensional data matrix symbol that complies with ISO/IEC 16022, ECC200. Marking follows MIL-STD-130, Identification Marking of U.S. Military Property, latest version."),
    L([
      "Each mark is verified with an automatic identification technology device programmed to the requirements of Appendix A of MIL-STD-130.",
      "The issuing agency code is not placed on the item.",
      "When an item is too small or otherwise impractical to mark, follow the alternative marking provisions of MIL-STD-130.",
      "Shipments, storage containers, and packages that contain uniquely identified items are labeled in accordance with MIL-STD-129, Military Marking for Shipment and Storage, latest version."]),
    P("**Serialization construct.** The enterprise chooses one of three methods."),
    CARDS([
      {h:"Within the enterprise identifier", b:"Serial numbers are unique across everything the enterprise makes. MIL-STD-130 calls this Construct 1."},
      {h:"Within the original part, lot, or batch number", b:"Serial numbers are unique within each part, lot, or batch number. MIL-STD-130 calls this Construct 2."},
      {h:"A DoD recognized equivalent", b:"An existing unique identification system the DoD accepts in place of a constructed UII."}]),
    P("Each method gives every item its own identity. **Lot/batch recording alone does not satisfy IUID.**"),
    P("**Reporting.** The contractor reports each UII at delivery, as part of the Material Inspection and Receiving Report."),
    L([
      "End items are reported through the receiving report capability in Wide Area WorkFlow (WAWF).",
      "Embedded items are reported through the WAWF embedded items capability, by direct data submission to the IUID Registry, or as a WAWF deliverable attachment.",
      "For each embedded item, the report includes the UII of the parent item that contains it."]),
    P("Configuration Management reconciles the IUID code on the design against the UIIs reported.")
  ],
  check:{q:"A supplier proposes to satisfy IUID on a batch of identical brackets by marking each with the same lot number in a data matrix. What is wrong?",
   o:[
     "Every UII must include a serial number that gives each item its own identity",
     "Nothing, provided the data matrix complies with ISO/IEC 16022",
     "The mark must also include the issuing agency code in the data matrix",
     "Brackets are too small for data matrix marking, so a tag must be used instead"],
   a:0, why:"Every serialization construct ends in a serial number that makes each item unique. A shared lot number distinguishes no bracket from another. Lot/batch recording alone does not satisfy IUID. The issuing agency code is deliberately not placed on the item."}},

 {id:"M4-09", gov:["R_IUID_APPLY"], title:"Applying the IUID code", body:[
    P("For each item that holds an IUID requirement, apply:"),
    NOTE("IUID_I"),
    NOTE("SER_L"),
    P("For each parent item that contains an embedded item carrying a UII, apply:"),
    NOTE("IUID_P"),
    P("Coordinate the parent item level with the contracting activity. The contract governs which assembly is the parent item."),
    S("SER and TR flow up the product tree. IUID does not.",
      "Apply IUID only to items that hold an IUID requirement and to the parent items the contract identifies."),
    P("Put the two rules side by side on one assembly. A parent item contains an embedded item with a UII. The contract names it as the parent item, so it takes IUID. Its embedded item carries SER, so the climb gives it SER and TR. It takes IUID, SER, and TR."),
    P("Its own parent, one level up, is different. That assembly is a physical parent of a serialized item, so it takes SER and TR. Unless the contract names it too, it takes no IUID.")
  ],
  check:{q:"An avionics unit is identified by the contract as the parent item for an embedded DoD serially managed circuit card. The unit goes into an equipment rack, which goes into the aircraft. Which codes does the rack take, assuming the contract does not name it?",
   o:[
     "SER and TR",
     "IUID, SER, and TR",
     "IUID only",
     "No code"],
   a:0, why:"The rack is a physical parent of a serialized item below the end item, so the climb gives it SER and TR. IUID does not flow up the product tree. The rack takes IUID only if the contract identifies it as a parent item."}}
 ],
 drill:[
  {id:"M4-L1", find:"n/a", pn:"EX-TAIL-ASSIGNED", nm:"AIRPLANE, COMPLETE (END ITEM)",
   facts:["The top-level asset under contract.","The contract carries no IUID clause.","Traceable items are installed beneath it."],
   a:["TR"], why:"The end item takes TR with the terminator text. It does not take SER. The contract assigns its identity."},
  {id:"M4-L2", find:"1", pn:"EX-IN-5500", nm:"INSTALLATION, FLAP",
   facts:["An installation drawing between a serialized flap drive unit and the end item."],
   a:["TR"], why:"An installation drawing is not a physical part, so no SER. The chain passes through it, so TR with the installation text."},
  {id:"M4-L3", find:"2", pn:"EX-5500-100", nm:"UNIT, FLAP DRIVE (LRU)",
   facts:["A Line Replaceable Unit.","Its children include a serialized actuator.","No requirement of its own."],
   a:["SER","TR"], why:"A physical parent of a serialized item, below the end item. The climb gives SER and TR. Being an LRU changes nothing."},
  {id:"M4-L4", find:"6", pn:"EX-6200-310", nm:"VALVE, DEPOT-LEVEL REPARABLE",
   facts:["The contract includes DFARS 252.211-7003.","The item manager identifies it as serially managed.","Unit acquisition cost: $900."],
   a:["IUID","SER"], why:"A DoD serially managed item requires IUID regardless of value. Every UII carries a serial number, so IUID travels with SER."},
  {id:"M4-L5", find:"3", pn:"EX-AV-2210", nm:"UNIT, AVIONICS (CONTRACT-DESIGNATED PARENT ITEM)",
   facts:["The contract includes DFARS 252.211-7003 and names this unit as the parent item.","It contains an embedded circuit card that carries a UII."],
   a:["IUID","SER","TR"], why:"The contract names it as a parent item, so IUID with the parent item text, and SER. Its embedded card carries SER, so the climb adds TR."},
  {id:"M4-L6", find:"4", pn:"EX-RK-0900", nm:"RACK, EQUIPMENT",
   facts:["Contains the contract-designated avionics parent item.","The contract does not name the rack."],
   a:["SER","TR"], why:"The rack is a physical parent of a serialized item. SER and TR climb. IUID does not."},
  {id:"M4-L7", find:"5", pn:"EX-ACT-7710", nm:"ACTUATOR, CYCLE-LIMITED",
   facts:["Life-limited by flight cycles.","FAA certification only. No DFARS clauses in the contract.","Unit cost: $12,000."],
   a:["LL","SER"], why:"The cycle limit drives LL and SER. IUID comes from DFARS 252.211-7003 in the contract, and it is absent, so the value does not matter."}
 ],
 exercises:[
  {id:"M4-E1", title:"Exercise 1: Climb a tree",
   scen:"A missile system is the end item. Beneath it: a guidance section installation drawing; a guidance section assembly; an inertial measurement unit; a circuit card inside the IMU that uses tantalum capacitors with a shelf-life limit; and a thermal battery that is explosive material. The contract includes DFARS 252.211-7003. The IMU is a DoD serially managed item. The contract names the guidance section assembly as the parent item for the IMU.",
   parts:[
    {id:"a", q:"List every item in the tree from the bottom up, with its codes and note form."},
    {id:"b", q:"Which items take IUID? Explain why the others do not."},
    {id:"c", q:"The guidance section installation drawing: which codes, and why no SER?"},
    {id:"d", q:"What does the end item take? What gives it its identity?"},
    {id:"e", q:"Which condition codes appear in the tree, and why does none of them climb?"}
   ]},
  {id:"M4-E2", title:"Exercise 2: The IUID challenge",
   scen:"A supplier builds a $3,200 hydraulic pump for a military transport. The prime contract includes DFARS 252.211-7003. The pump is not on the list of serially managed items, and the contract does not identify it as mission essential or controlled inventory. The supplier's subcontract is a commercial products subcontract. The supplier plans to mark each pump with its part number and a lot number in a data matrix, and to report nothing.",
   parts:[
    {id:"a", q:"Does the pump require IUID? Walk through the categories and say what fact you would need to confirm your answer."},
    {id:"b", q:"The supplier argues that a commercial products subcontract is exempt from the IUID clause. Answer them."},
    {id:"c", q:"If IUID did apply, what is wrong with the supplier's marking plan?"},
    {id:"d", q:"If IUID did apply, what reporting is due, when, and through what channel?"},
    {id:"e", q:"Whatever the IUID answer, what codes does the pump's parent assembly take if the pump carries SER?"}
   ]}
 ]
},

{
 id:"M5", label:"Module 5", title:"Life limits, critical items, and the matrix", sub:"The LL code and 14 CFR 43.10, cycle and shelf-life limits, Critical Safety Items, fracture-critical parts, Safety-Critical Items, and the application matrix that pulls every rule together",
 sections:[
 {id:"M5-01", gov:["R_LL"], title:"The LL code and 14 CFR 43.10", body:[
    P("The Life Limited code, LL, identifies the item as life-limited and states its limit. It does not create records on its own. Apply it with the identity code that the requirement source drives."),
    P("14 CFR 43.10 supplies the definitions."),
    C("14 CFR 43.10(a)", [
      "**Life-limited part** means “any part for which a mandatory replacement limit is specified in the type design, the Instructions for Continued Airworthiness, or the maintenance manual.”",
      "**Life status** means “the accumulated cycles, hours, or any other mandatory replacement limit of a life-limited part.”"], "teal"),
    P("The limit may be expressed in cycles, hours, or calendar time. The form of the limit sets which LL note text you use. It does not set the identity code."),
    P("There are two categories of life-limited item."),
    CARDS([
      {h:"Cycle/usage-controlled", b:"Limited by cycles or operating hours. Remaining life is a per-unit quantity. Serialized."},
      {h:"Age/shelf-life-controlled", b:"Limited by shelf life, cure date, or storage age. The limit usually attaches to the manufacturing lot/batch. Lot/batch recorded, unless another source requires a serial number."}], 2),
    S("LL states the limit. The requirement source sets the identity code.")
  ],
  check:{q:"Where can a mandatory replacement limit be specified and still make a part life-limited under 14 CFR 43.10?",
   o:[
     "In the type design, the Instructions for Continued Airworthiness, or the maintenance manual",
     "Only in the Airworthiness Limitations Section",
     "Only in the type certificate data sheet issued by the FAA for the product",
     "Anywhere the manufacturer recommends a replacement in its service literature"],
   a:0, why:"The definition names three places: the type design, the ICA, or the maintenance manual. The ALS is one part of the ICA. A recommendation is not a mandatory replacement limit."}},

 {id:"M5-02", gov:["R_LL_CONTROL"], title:"Controlling a removed life-limited part", body:[
    P("14 CFR 43.10(c) requires each person who removes a life-limited part from a type-certificated product to control it. The method must deter installation after the part reaches its life limit. The acceptable methods are:"),
    TABLE(["Method", "What it takes"], [
      ["Record keeping system", "Part number, serial number, and current life status, updated at each removal"],
      ["Tag or record attached to the part", "Part number, serial number, and current life status"],
      ["Non-permanent marking", "Current life status, marked legibly, updated at each removal"],
      ["Permanent marking", "Current life status, permanently marked"],
      ["Segregation", "Physical separation from eligible parts, with records"],
      ["Mutilation", "Rendering the part beyond repair and incapable of appearing airworthy"],
      ["Other method", "Any method approved or accepted by the FAA"]]),
    P("When the part is later sold or transferred, the mark, tag, or record goes with it, unless the part is mutilated first."),
    S("Most of these methods need a part number and a serial number.",
      "Serialization is what makes 43.10 compliance workable. The serialization requirement itself comes from 14 CFR 45.15(c) when the limit is in the Airworthiness Limitations Section."),
    P("The marking methods rely on 14 CFR 45.16. When a person required to comply with 43.10 asks, the holder of the type certificate or design approval for a life-limited part must provide marking instructions, or state that the part cannot be practicably marked without compromising its integrity. That is a design responsibility."),
    C("Shelf life is a different regime", [
      "A shelf life, cure date, or storage age limit on material held in storage is not, by itself, a 14 CFR 43.10 mandatory replacement limit.",
      "The LL code still applies to age/shelf-life-controlled items. The code covers both categories. The regulation does not. Know which regime a limit sits in before you cite 43.10."])
  ],
  check:{q:"A mechanic asks how to mark a removed life-limited fitting with its life status. Under 14 CFR 45.16, who must answer?",
   o:[
     "The holder of the type certificate or design approval for the part",
     "The mechanic's repair station, from its own procedures",
     "The FAA, through an Advisory Circular",
     "Nobody. Marking is only one of the optional methods under 43.10"],
   a:0, why:"14 CFR 45.16 puts the answer on the design approval holder. It must provide marking instructions or state that the part cannot be practicably marked without compromising its integrity. Marking is one of several 43.10 methods, so it is not the only option, but the question must still be answered."}},

 {id:"M5-03", gov:["R_LL_CYCLE"], title:"Cycle/usage-controlled items", body:[
    P("A Cycle/Usage-Controlled Life-Limited Item is an item life-limited by cycles or operating hours. It is serialized, because remaining life is a per-unit quantity. Two identical disks on the same shelf can have very different remaining lives."),
    P("Common examples:"),
    CARDS([
      {h:"Landing gear", b:"Landing gear assemblies. Main gear shock struts and oleo cylinders. Main wheel axles. Side stays and drag braces."},
      {h:"Engines and power", b:"Turbine disks. Compressor disks. Turbine blades. Auxiliary power unit components."},
      {h:"Systems and actuation", b:"Flap and slat actuator ball screws. Air cycle machine turbines and compressors. Ram air turbine deploy actuators. Primary bleed air valves. Pitch change actuator piston assemblies."}]),
    P("For a Cycle/Usage-Controlled Life-Limited Item, apply:"),
    NOTE("LL_CYC"),
    NOTE("SER_L"),
    P("The bracketed field states the limit. A number of flights, a cycle limit, or operating hours. Write the number, not a pointer to a document that someone must go find.")
  ],
  check:{q:"A compressor disk is limited to 20,000 engine cycles. Which codes apply?",
   o:[
     "LL with the cycle/usage note text, and SER",
     "LL with the age and shelf-life note text, and LOT",
     "SER only, because the disk is tracked by engine",
     "LL only, because the engine log tracks the cycles"],
   a:0, why:"A cycle limit makes the disk a cycle/usage-controlled item. Remaining life is counted per disk, so each disk needs its own serial number. The engine log records cycles against a serial number. Without the serial number, the log cannot say which disk it is counting."}},

 {id:"M5-04", gov:["R_LL_AGE"], title:"Age/shelf-life-controlled items", body:[
    P("An Age/Shelf-Life-Controlled Life-Limited Item is an item life-limited by shelf life, cure date, or storage age. It is lot/batch recorded, because the limit attaches to the manufacturing lot/batch rather than to the individual unit."),
    P("Common examples:"),
    CARDS([
      {h:"Seals and hoses", b:"O-rings. Gaskets. Rubber-based hoses, such as hydraulic hoses and fuel hoses."},
      {h:"Electrical", b:"Electronic components (EEE). Microchips. Capacitors. Diodes. Lithium batteries. Standard circuit breakers. Relays."},
      {h:"Chemicals and composites", b:"Epoxy resins used in structural bonding. Prepregs. Polysulfide or polythioether gap and fuel tank sealants. Polyurethane topcoats. Chromate and non-chromate primers. Synthetic grease for actuator screws, landing gear pivots, or bearings."},
      {h:"Emergency and survival", b:"Emergency oxygen candles. Fire extinguisher squibs. Oxygen mask rebreather bags. Medical kits. Life vests and life jackets."},
      {h:"Filters", b:"Filters."},
      {h:"Not on this list", b:"Specialized metallic fasteners. They have no shelf life. They carry heat and lot traceability under process and batch conditions."}]),
    P("A calendar limit does not by itself make an item a lot/batch item. Two pairings follow."),
    P("**A calendar limit on a discrete part with an Airworthiness Limitations Section entry.** 14 CFR 45.15(c) requires the serial number whatever form the limit takes. Apply:"),
    NOTE("LL_AGE"),
    NOTE("SER_L"),
    P("**A shelf life, cure date, or storage age limit that attaches to the manufacturing lot/batch.** Use this pairing when no certification or contract requirement calls for serialization. Apply:"),
    NOTE("LL_AGE"),
    NOTE("LOT_L")
  ],
  check:{q:"Oxygen mask rebreather bags carry a shelf-life limit on the manufacturing lot. Nothing else calls for serialization. Which codes apply?",
   o:[
     "LL with the age and shelf-life note text, and LOT",
     "LL with the age and shelf-life note text, and SER",
     "LL with the cycle/usage note text, and SER",
     "LOT only"],
   a:0, why:"The limit attaches to the lot, and no certification or contract requirement calls for serialization. That is the second pairing: LL with the age and shelf-life text, and LOT. SER would apply only if a source such as an ALS entry on a discrete part required it."}},

 {id:"M5-05", gov:["R_CRITICAL","R_CSI"], title:"Critical items and Critical Safety Items", body:[
    P("“Critical items” is a broad term. It covers many part classifications related to safety. Some come from customer requirements or regulatory agencies. Others rest on engineering governance and analysis. Three matter for part note codes: Critical Safety Items, Fracture-Critical Traceable Parts, and Safety-Critical Items. The names are close. The rules are not."),
    P("DFARS 209.270-2 defines an aviation critical safety item as a part, an assembly, installation equipment, launch equipment, recovery equipment, or support equipment for an aircraft or aviation weapon system if the part, assembly, or equipment contains a characteristic any failure, malfunction, or absence of which could cause any of the following:"),
    C("DFARS 209.270-2", [
      "“(1) A catastrophic or critical failure resulting in the loss of or serious damage to the aircraft or weapon system;”",
      "“(2) An unacceptable risk of personal injury or loss of life; or”",
      "“(3) An uncommanded engine shutdown that jeopardizes safety.”"], "teal"),
    P("Section 802 of Public Law 108-136 is the statutory basis. DFARS 209.270 and DFARS PGI 209.270 set the qualification requirements, source approval, and procedures. The contract clause at DFARS 252.209-7010 carries the definitions and the heightened quality assurance surveillance requirement."),
    P("**Who designates.** The design control activity designates Critical Safety Items. DFARS 252.209-7010 defines it, for an aviation critical safety item, as “the systems command of a military department that is specifically responsible for ensuring the airworthiness of an aviation system or equipment, in which an aviation critical safety item is to be used.” Systems Safety and engineering support provide inputs. They do not make the designation."),
    P("**Where it does not apply.** Critical Safety Item identification does not apply to aircraft or subsystems bought, operated, and maintained under FAA certification, unless the United States Air Force Engineering Support Activity requires it. Critical Safety Item policies do not override or duplicate FAA approaches when those approaches apply and meet military Critical Safety Item objectives.")
  ],
  check:{q:"An engineer's hazard analysis shows a bracket failure could cause loss of the aircraft. The engineer applies the CSI code on their own authority. What is wrong?",
   o:[
     "The design control activity designates Critical Safety Items. Engineering provides inputs",
     "Nothing. Any engineer may designate a CSI from a hazard analysis",
     "CSI applies only to engines and rotating hardware, never to airframe structure",
     "The bracket must first be shown to be single load path under MIL-STD-1530D"],
   a:0, why:"Under DFARS 252.209-7010, the design control activity, a military systems command responsible for airworthiness, designates CSIs. Systems Safety and engineering analysis are inputs to that decision. The engineer should raise the finding for designation, not self-designate."}},

 {id:"M5-06", gov:["R_CSI"], title:"Coding a Critical Safety Item", body:[
    P("Serialization reaches a Critical Safety Item through IUID. Follow the chain:"),
    STEPS([
      {h:"DoDI 8320.04", b:"Directs the primary inventory control activity to identify Critical Safety Items as DoD serially managed items."},
      {h:"DFARS 211.274-2(a)(3)(i)", b:"Requires IUID for any DoD serially managed item, regardless of value."},
      {h:"The UII", b:"Every UII carries a serial number. The CSI is serialized."}]),
    P("Lot/batch recording is also required, with traceability to an approved source. Lot and heat control is typical for structural and rotating hardware."),
    P("For Critical Safety Items, apply all four:"),
    NOTE("CSI"),
    NOTE("SER_L"),
    NOTE("LOT_L"),
    NOTE("IUID_I"),
    S("CSI does not flow up the product tree.",
      "SER and TR climb to the end item. IUID goes to the parent items the contract identifies. CSI stays on the item that holds it.")
  ],
  check:{q:"A flight control bellcrank is designated a Critical Safety Item. It goes into a control linkage assembly. What does the linkage assembly take, assuming the contract does not name it as a parent item?",
   o:[
     "SER and TR",
     "CSI, SER, and TR",
     "CSI, SER, LOT, IUID, and TR",
     "No code, because only the bellcrank is critical"],
   a:0, why:"The bellcrank carries CSI, SER, LOT, and IUID. The linkage assembly is a physical parent of a serialized item, so it takes SER and TR. CSI does not flow up. IUID goes only to contract-identified parent items."}},

 {id:"M5-07", gov:["R_FC"], title:"Fracture-Critical Traceable Parts and Fracture-Critical Parts", body:[
    P("MIL-STD-1530D with Change 1 governs the Aircraft Structural Integrity Program (ASIP). It defines two separate categories. MIL-STD-1530C carries the same definitions."),
    CARDS([
      {h:"Fracture-Critical Traceable Part", b:"A safety-of-flight structural component that is either single load path or sized by durability or damage tolerance requirements."},
      {h:"Fracture-Critical Part", b:"A safety-of-flight structural component that is not single load path and is not sized by durability or damage tolerance requirements, but that requires special emphasis due to the criticality."}], 2),
    P("The two definitions exclude each other. The standard's Figure 1 shows them as separate branches. A Fracture-Critical Traceable Part is not a subclass of a Fracture-Critical Part."),
    P("**Fracture-Critical Traceable Parts** require serialization and lot/batch recording as one of their controls. Lot/batch recording supports material and process traceability. They take FC, SER, and LOT."),
    NOTE("FC"),
    NOTE("SER_L"),
    NOTE("LOT_L"),
    P("**Fracture-Critical Parts** still take lot/batch recording. Fracture control relies on material properties and process condition. Raw material heat and lot traceability applies, with process control on forging, machining, and surface treatment. They take FC and LOT. They do not take SER on this basis."),
    NOTE("FC"),
    NOTE("LOT_L"),
    C("Not the same as Fracture Critical Category I and II", [
      "Fracture Critical Category I and Category II Parts are a different scheme. They go through the Critical Safety Item or Safety-Critical Item screening process, and that process decides whether part traceability applies.",
      "Fracture-Critical Traceable Parts always require serialization and lot/batch recording. See the critical part and process selection and controls section of MIL-STD-1530D with Change 1, and the Durability and Damage Tolerance Control Plan."]),
    P("FC does not flow up the product tree. SER and TR do.")
  ],
  check:{q:"A redundant, non-damage-tolerance-sized structural fitting is a safety-of-flight component that the program says needs special emphasis. Which codes apply on this basis?",
   o:[
     "FC and LOT",
     "FC, SER, and LOT",
     "FC only",
     "SER and LOT"],
   a:0, why:"Not single load path and not sized by durability or damage tolerance, but requiring special emphasis: that is a Fracture-Critical Part. It takes FC and LOT for material and process traceability. It does not take SER on this basis. A Fracture-Critical Traceable Part would add SER."}},

 {id:"M5-08", gov:["R_SCI"], title:"Safety-Critical Items", body:[
    C("Definition, MIL-STD-882E", [
      "A **Safety-Critical Item (SCI)** is “a hardware or software item that has been determined through analysis to potentially contribute to a hazard with Catastrophic or Critical mishap potential, or that may be implemented to mitigate a hazard with Catastrophic or Critical mishap potential.”"]),
    P("MIL-STD-882E defines the severity categories behind those words. **Catastrophic** could result in death, permanent total disability, irreversible significant environmental impact, or monetary loss of $10 million or more. **Critical** could result in permanent partial disability, injuries or occupational illness that may result in hospitalization of at least three personnel, reversible significant environmental impact, or monetary loss of $1 million or more but less than $10 million."),
    P("Safety-Critical Items are often confused with Critical Safety Items. MIL-STD-882E settles the point. It states that its definition of “safety-critical item” is independent of the definition of “critical safety item” in Public Laws 108-136 and 109-364."),
    CARDS([
      {h:"Critical Safety Item", b:"DFARS and statute. Designated by the design control activity. Takes CSI, SER, LOT, and IUID."},
      {h:"Safety-Critical Item", b:"MIL-STD-882E system safety analysis. Drives design and process controls. No part note code."}], 2),
    S("No part note code identifies a Safety-Critical Item.",
      "System Safety analysis outputs drive design and process controls for SCIs. They do not drive item marking."),
    P("SCI designation does not drive serialization or lot/batch recording on its own. An SCI is serialized or lot/batch recorded when it is life-limited or otherwise holds a serialization or lot/batch recording requirement. Code it from those sources.")
  ],
  check:{q:"A hazard analysis identifies a hydraulic valve as a Safety-Critical Item. No other source applies to it. Which codes does it take?",
   o:[
     "No code on this basis",
     "CSI, SER, LOT, and IUID",
     "SER and LOT",
     "LL and SER"],
   a:0, why:"An SCI designation drives design and process controls, not marking. No code identifies an SCI, and the designation alone drives neither serialization nor lot/batch recording. CSI is a different designation, made by a different authority. If a real source applies later, such as a life limit, code from that source."}},

 {id:"M5-09", gov:["R_MATRIX","R_STACKING"], title:"The application matrix", body:[
    P("Start here when you know the item and need the codes. The matrix is a summary of every rule in this course. Every item carrying SER or LOT also climbs to the end item."),
    TABLE(["Item or condition", "Codes to apply", "Covered in"], [
      ["Cycle/usage-controlled life-limited item", "LL, SER", "M5-03"],
      ["Age/shelf-life-controlled life-limited item, limit on the lot/batch", "LL, LOT", "M5-04"],
      ["ALI on a discrete part, replacement limit in cycles, landings, or flight hours", "SER, LL (cycle/usage text)", "M2-03"],
      ["ALI on a discrete part, replacement limit in calendar time", "SER, LL (age and shelf-life text)", "M2-04"],
      ["ALI on a discrete part, inspection interval or related procedure only", "SER", "M2-03"],
      ["ALI at an airframe location or zone, no separately manufactured part", "None", "M2-03"],
      ["ALI expressed against a manufactured lot/batch (uncommon)", "LOT, LL", "M2-05"],
      ["Safe-life PSE, discrete part with an ALS replacement time", "LL, SER", "M2-06"],
      ["Safe-life PSE detail parts and constituent materials", "LOT", "M2-06, M2-07"],
      ["Damage-tolerant PSE, discrete part with an ALS inspection interval", "SER", "M2-07"],
      ["Damage-tolerant PSE, location-based inspection", "None", "M2-07"],
      ["Premium selected material part", "SER, LOT", "M2-08"],
      ["Critical Safety Item", "CSI, SER, LOT, IUID", "M5-06"],
      ["Fracture-Critical Traceable Part", "FC, SER, LOT", "M5-07"],
      ["Fracture-Critical Part (not traceable)", "FC, LOT", "M5-07"],
      ["Safety-Critical Item", "None on this basis", "M5-08"],
      ["Casting with reduced non-visual inspection", "LOT", "M3-02"],
      ["Casting using process monitoring for a factor of 1.0", "LOT", "M3-02"],
      ["Part using alternative approved material design values", "LOT", "M3-02"],
      ["Item established by a process or batch condition", "LOT", "M3-03"],
      ["Electronic part under a counterfeit avoidance clause", "LOT", "M3-04"],
      ["Raw material callout requiring traceability", "LOT (short text)", "M1-08"],
      ["Item requiring special handling", "SH, LOT", "M3-06"],
      ["Explosive material", "SH, LOT", "M3-08"],
      ["Radioactive material", "SH, LOT", "M3-09"],
      ["DoD serially managed item", "IUID, SER", "M4-07"],
      ["Parent item of an embedded item carrying a UII", "IUID, SER", "M4-09"],
      ["Warranted serialized item", "IUID, SER", "M4-07"],
      ["Special tooling or special test equipment for an MDAP", "IUID, SER", "M4-07"],
      ["High risk item identified by the requiring activity", "IUID, SER", "M4-07"],
      ["Physical parent of a SER or LOT item, below the end item", "SER, TR", "M4-02"],
      ["Installation drawing between a traceable item and the end item", "TR (installation text)", "M4-03"],
      ["End item", "TR (terminator text), IUID if the contract requires it", "M4-03"]]),
    P("The matrix gives one row at a time. Real items often hit several rows. Use the method:"),
    STEPS([
      {h:"List every source that applies", b:"Regulation, contract clause, designation, physical condition. Do not stop at the first."},
      {h:"Take the union of the codes", b:"Each code once. One LOT covers every source that needs lot records."},
      {h:"Choose the note texts", b:"Long or short for SER and LOT. Cycle/usage or age and shelf-life for LL. State the SH control."},
      {h:"Add TR if the item has traceable children", b:"Then climb: every physical parent below the end item takes SER and TR."}], "tl"),
    S("Find every source. Apply every code. Then climb.")
  ],
  check:{q:"A turbine disk is cycle-limited, is a Critical Safety Item, and is bought under a contract with DFARS 252.211-7003. Which codes does it take?",
   o:[
     "CSI, LL, SER, LOT, and IUID",
     "CSI, SER, LOT, and IUID",
     "LL and SER",
     "CSI, LL, SER, LOT, IUID, and TR"],
   a:0, why:"Take the union. The cycle limit drives LL and SER. The CSI designation drives CSI, SER, LOT, and IUID. SER appears once. The disk has no traceable children, so no TR on the disk itself. TR goes on its parent."}}

/* ==========================================================================
   RENDERING HELPERS
   ========================================================================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}

/* ---- option order ----------------------------------------------------------
   Options are authored in a fixed order, with the correct one at check.a. They
   are DISPLAYED in a shuffled order, so that the position of the correct answer
   carries no information. A trainee who never reads the options and always picks
   the second one scores what guessing is worth, which is the point.

   The shuffle is deterministic, seeded from the section id. One trainee sees the
   same order every time they reload, a saved record reopens showing the same
   order, and two trainees discussing "the third option" are looking at the same
   sentence. Nothing here depends on the order: radio values, STATE.checks.picks
   and check.a are all authored indices throughout.

   OPTION_SALT was chosen so the correct answer lands as evenly as possible across
   the four display positions for the current section ids. Re-measure it if the
   section ids change, and remember that a new salt reshuffles every section,
   which invalidates any answer key printed from an earlier revision.
   ---------------------------------------------------------------------------- */
var OPTION_SALT = 437;   // Rev A: correct answer lands 10/11/11/11 across the four positions for the 43 sections, with no position repeated three times in a row.
function optionOrder(id, n){
  var h = 2166136261;                            // FNV-1a over the section id
  for(var i=0;i<id.length;i++){ h = Math.imul(h ^ id.charCodeAt(i), 16777619); }
  var a = (h ^ OPTION_SALT) >>> 0;
  function rnd(){                                // mulberry32
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0);
  }
  var idx=[]; for(var k=0;k<n;k++) idx.push(k);
  for(var j=n-1;j>0;j--){                        // Fisher-Yates, seeded
    var r = rnd() % (j+1);
    var t2 = idx[j]; idx[j]=idx[r]; idx[r]=t2;
  }
  return idx;
}
function chips(codes){
  if(!codes || !codes.length) return "<span class='chip none'>no code</span>";
  return codes.map(function(c){ return "<span class='chip'>"+esc(c)+"</span>"; }).join("");
}
function block(b){
  if(b.t==="p") return "<p>"+fmt(b.x)+"</p>";
  if(b.t==="list") return "<ul class='pl'>"+b.x.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ul>";
  if(b.t==="callout") return "<div class='callout "+(b.tone==="teal"?"teal":"")+"'>"+
      (b.lab?"<div class='lab'>"+esc(b.lab)+"</div>":"")+
      b.x.map(function(i){return "<p>"+fmt(i)+"</p>";}).join("")+"</div>";
  if(b.t==="stmt") return "<div class='stmt'><b>"+fmt(b.x)+"</b>"+(b.sub?"<span>"+fmt(b.sub)+"</span>":"")+"</div>";
  if(b.t==="cards") return "<div class='cards c"+b.cols+"'>"+b.x.map(function(c){
      return "<div class='card'><h4>"+fmt(c.h)+"</h4><p>"+fmt(c.b)+"</p></div>";}).join("")+"</div>";
  if(b.t==="steps") return "<div class='steps'>"+b.x.map(function(s,i){
      return "<div class='step "+(b.tone||"")+"'><div class='n'>"+(i+1)+"</div><div class='tx'><b>"+fmt(s.h)+"</b><span>"+fmt(s.b)+"</span></div></div>";}).join("")+"</div>";
  if(b.t==="note"){
    var cut=b.x.indexOf(" – ");
    var code=cut>0?b.x.slice(0,cut):"", rest=cut>0?b.x.slice(cut+3):b.x;
    return "<div class='pnote'>"+(code?"<span class='pc'>"+esc(code)+"</span>":"")+"<span>"+esc(rest)+"</span></div>";
  }
  if(b.t==="tree") return "<div class='tree'>"+b.x.map(function(r){
      var pad=r[0]*22;
      return "<div class='trow'><div class='tn' style='padding-left:"+pad+"px'>"+(r[0]?"<span class='tbar'>└ </span>":"")+
        "<b>"+fmt(r[1])+"</b>"+(r[3]?"<i>"+fmt(r[3])+"</i>":"")+"</div><div class='tc'>"+chips(r[2])+"</div></div>";
    }).join("")+"</div>";
  if(b.t==="table"){
    var th="<tr>"+b.head.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr>";
    var tb=b.x.map(function(r){
      return "<tr>"+r.map(function(c,ci){
        var k = (ci===0 && String(c).length<=10) ? " class='k'" : "";
        return "<td"+k+">"+fmt(c)+"</td>";}).join("")+"</tr>";}).join("");
    return "<div class='tw'><table><thead>"+th+"</thead><tbody>"+tb+"</tbody></table></div>";
  }
  return "";
}
function pageIndex(){
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    if(VIEW.page==="start"&&p.k==="start") return i;
    if(VIEW.page==="submit"&&p.k==="submit") return i;
    if(VIEW.page==="trainer"&&p.k==="trainer") return i;
    if(VIEW.page==="s:"+p.id) return i;
    if(VIEW.page==="d:"+p.grp&&p.k==="drill") return i;
    if(VIEW.page==="x:"+p.grp&&p.k==="ex") return i;
  }
  return 0;
}
function pageKey(p){
  if(p.k==="start") return "start";
  if(p.k==="submit") return "submit";
  if(p.k==="trainer") return "trainer";
  if(p.k==="drill") return "d:"+p.grp;
  if(p.k==="ex") return "x:"+p.grp;
  return "s:"+p.id;
}

/* ---- completion status ---- */
function sectStatus(id){
  if(STATE.checks[id]) return "done";
  if(STATE.seen[id]) return "work";
  return "";
}
function drillStatus(modId){
  var m=mod(modId), n=0;
  (m.drill||[]).forEach(function(d){ if(STATE.drills[d.id]) n++; });
  if(n===0) return "";
  return n===m.drill.length ? "done" : "work";
}
function exStatus(modId){
  var m = mod(modId), total=0, filled=0;
  m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    total++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filled++;
  });});
  if(filled===0) return "";
  return filled===total ? "done" : "work";
}
function mod(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; }

function counts(){
  var totalChecks=0, answered=0, right=0;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    totalChecks++;
    var c=STATE.checks[s.id];
    if(c){ answered++; if(c.first===true) right++; }
  });});
  var totalDrill=0, drilled=0, drillRight=0;
  MODULES.forEach(function(m){ (m.drill||[]).forEach(function(d){
    totalDrill++;
    var r=STATE.drills[d.id];
    if(r){ drilled++; if(r.first===true) drillRight++; }
  });});
  var totalParts=0, filledParts=0;
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    totalParts++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filledParts++;
  });});});
  return {totalChecks:totalChecks, answered:answered, right:right,
          totalDrill:totalDrill, drilled:drilled, drillRight:drillRight,
          totalParts:totalParts, filledParts:filledParts};
}

function drawRail(){
  var c=counts();
  var h="<div class='railhead'><h2>Section register</h2><p>"+c.answered+" of "+c.totalChecks+
        " sections released · "+c.drilled+" of "+c.totalDrill+" drill lines coded · "+
        c.filledParts+" of "+c.totalParts+" exercise answers written</p></div>";
  h+="<div class='grp'>"+navBtn(PAGES[0])+"</div>";
  MODULES.forEach(function(m){
    h+="<div class='grp'><h3>"+esc(m.label)+": "+esc(m.title)+"</h3>";
    PAGES.forEach(function(p){ if(p.grp===m.id) h+=navBtn(p); });
    h+="</div>";
  });
  h+="<div class='grp'>";
  PAGES.forEach(function(p){ if(p.k==="submit"||p.k==="trainer") h+=navBtn(p); });
  h+="</div>";
  document.getElementById("rail").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#rail .nav"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-k")); });
  });
}
function navBtn(p){
  var st = p.k==="sect" ? sectStatus(p.id) : (p.k==="ex" ? exStatus(p.grp) : (p.k==="drill" ? drillStatus(p.grp) : ""));
  var cur = pageKey(p)===VIEW.page;
  return "<button class='nav' data-k='"+pageKey(p)+"' aria-current='"+(cur?"true":"false")+"'>"+
    "<span class='dot "+st+"'></span><span class='id'>"+esc(p.id)+"</span><span class='nm'>"+esc(p.nm)+"</span></button>";
}

  VIEW.page=key;

function draw(){

function viewSection(m,s,p){
  var idx=m.sections.indexOf(s)+1;
  var st=sectStatus(s.id);
  var stl = st==="done" ? "Released" : (st==="work" ? "In work" : "Not started");
  var h="<div class='eyebrow'><span class='recid'>"+esc(s.id)+"</span>"+
        "<span class='status'>"+esc(m.label)+" · section "+idx+" of "+m.sections.length+" · "+stl+"</span></div>"+
        "<h1 class='sect'>"+esc(s.title)+"</h1><div class='hr'></div>";
  s.body.forEach(function(b){ h+=block(b); });
  h+=checkHtml(s);
  return h;
}
function checkHtml(s){
  var rec=STATE.checks[s.id];
  var locked=!!rec;
  var h="<div class='check' data-check='"+esc(s.id)+"'><div class='lab'>Check yourself</div><div class='q'>"+fmt(s.check.q)+"</div>";
  optionOrder(s.id, s.check.o.length).forEach(function(i){
    var o=s.check.o[i];
    var cls="opt"+(locked?" locked":"");
    if(locked){
      if(i===s.check.a) cls+=" right";
      else if(rec.picks && rec.picks.indexOf(i)>=0) cls+=" wrong";
    }
    h+="<label class='"+cls+"'><input type='radio' name='ck_"+esc(s.id)+"' value='"+i+"'"+
       (locked?" disabled":"")+(rec&&rec.picks&&rec.picks.indexOf(i)>=0?" checked":"")+"> <span>"+fmt(o)+"</span></label>";
  });
  h+="<div class='btnrow' style='margin-top:12px;margin-bottom:0'>"+
     (locked?"":"<button class='btn pri' data-ckgo='"+esc(s.id)+"'>Check answer</button>")+"</div>";
  var fb="";
  if(locked){
    var ok = rec.first===true;
    fb="<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite")+"</b>"+fmt(s.check.why)+"</div>";
  }else{
    fb="<div class='fb' data-fb='"+esc(s.id)+"'></div>";
  }
  return h+fb+"</div>";
}

/* ---- parts-list drill ------------------------------------------------------
   Each drill line is one item on a parts list. The trainee ticks the part note
   codes the line takes, or "No code". Grading is an exact match of the set: one
   missing code or one extra code is wrong, because on a real parts list either
   one is a defect. The first attempt is the one that counts, as with the checks.
   ---------------------------------------------------------------------------- */
var CODES = ["SER","LOT","TR","IUID","LL","SH","CSI","FC"];
function sameSet(a,b){
  if(a.length!==b.length) return false;
  for(var i=0;i<a.length;i++) if(b.indexOf(a[i])<0) return false;
  return true;
}
function viewDrill(m){
  var h="<div class='eyebrow'><span class='recid'>"+esc(m.id)+"-DR</span><span class='status'>"+esc(m.label)+" · parts-list drill</span></div>"+

    "<p class='lede'>Read each line. Tick every part note code it takes. Then check it.</p><div class='hr'></div>"+
    "<div class='callout'><div class='lab'>Standing assumptions for every line</div>"+
    "<p>Unless the line says otherwise, the item has no children that carry SER or LOT, it is not the end item, and the contract carries no IUID clause.</p>"+
    "<p>A line is right only when the set is exact. A missing code is a defect. An extra code is also a defect. Tick <strong>No code</strong> when nothing applies.</p></div>";
  m.drill.forEach(function(d,n){ h+=drillHtml(d,n+1); });
  return h;
}
function drillHtml(d,n){
  var rec=STATE.drills[d.id], locked=!!rec;
  var picks=rec?rec.picks:[];
  var h="<div class='dline' data-drill='"+esc(d.id)+"'>"+
    "<div class='hd'><span><b>Line</b>"+esc(d.id)+"</span><span><b>Find</b>"+esc(d.find)+"</span><span><b>Part no.</b>"+esc(d.pn)+"</span></div>"+
    "<div class='bd'><div class='nm'>"+esc(d.nm)+"</div>"+
    "<ul class='pl'>"+d.facts.map(function(f){return "<li>"+fmt(f)+"</li>";}).join("")+"</ul>"+
    "<div class='codes'>";
  CODES.concat(["NONE"]).forEach(function(c){
    var on=picks.indexOf(c)>=0, should=(c==="NONE") ? d.a.length===0 : d.a.indexOf(c)>=0;
    var cls="code"+(c==="NONE"?" none":"")+(locked?" locked":"");
    if(locked){
      if(on && should) cls+=" right";
      else if(on && !should) cls+=" wrong";
      else if(!on && should) cls+=" missed";
    }
    h+="<label class='"+cls+"'><input type='checkbox' data-dcode='"+esc(d.id)+"' value='"+c+"'"+(on?" checked":"")+(locked?" disabled":"")+">"+
       (c==="NONE"?"No code":c)+"</label>";
  });
  h+="</div>";
  if(!locked){
    h+="<div class='btnrow' style='margin-top:14px;margin-bottom:0'><button class='btn pri' data-dgo='"+esc(d.id)+"'>Check this line</button></div>";
  }else{
    var ok=rec.first===true;
    h+="<div class='legend'><span><i class='lr'></i>correct pick</span><span><i class='lw'></i>should not be there</span><span><i class='lm'></i>missed</span></div>"+
       "<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite")+" · the line takes: "+(d.a.length?d.a.join(", "):"no code")+"</b>"+fmt(d.why)+"</div>";
  }
  return h+"</div></div>";
}
function gradeDrill(id){
  var d=null;
  MODULES.forEach(function(m){ (m.drill||[]).forEach(function(x){ if(x.id===id) d=x; }); });
  if(!d) return;
  var picks=[];
  Array.prototype.forEach.call(document.querySelectorAll("input[data-dcode='"+id+"']:checked"), function(i){ picks.push(i.value); });
  if(!picks.length){ toast("Tick at least one code, or No code."); return; }
  if(picks.indexOf("NONE")>=0 && picks.length>1){ toast("No code cannot be ticked with other codes."); return; }
  var ok = (picks[0]==="NONE") ? d.a.length===0 : sameSet(picks, d.a);
  STATE.drills[id]={ first:ok, picks:picks, at:new Date().toISOString() };
  autosave(); draw();
  var el=document.querySelector("[data-drill='"+id+"']");
  if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

function wordCount(v){
  var n=(v||"").trim(); n = n? n.split(/\s+/).length : 0;
  return n===0 ? "not started" : (n+" word"+(n===1?"":"s"));
}

function gapList(){
  var gaps=[];
  MODULES.forEach(function(m){
    m.sections.forEach(function(s){
      var r=STATE.checks[s.id];
      if(!r) gaps.push([s.id, s.title, "not attempted"]);
      else if(r.first!==true) gaps.push([s.id, s.title, "wrong on first attempt"]);
    });
    (m.drill||[]).forEach(function(d){
      var r=STATE.drills[d.id];
      if(!r) gaps.push([d.id, "Drill: "+d.nm, "not attempted"]);
      else if(r.first!==true) gaps.push([d.id, "Drill: "+d.nm, "coded "+pickText(r.picks)+", should be "+(d.a.length?d.a.join(", "):"no code")]);
    });
  });
  return gaps;
}

function wire(i,p){
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-nav")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ckgo]"), function(b){
    b.addEventListener("click", function(){ grade(b.getAttribute("data-ckgo")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-dgo]"), function(b){
    b.addEventListener("click", function(){ gradeDrill(b.getAttribute("data-dgo")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("input[data-dcode]"), function(inp){
    inp.addEventListener("change", function(){
      /* "No code" and a real code exclude each other */
      if(!inp.checked) return;
      var id=inp.getAttribute("data-dcode");
      Array.prototype.forEach.call(document.querySelectorAll("input[data-dcode='"+id+"']"), function(o){
        if(o===inp) return;
        if(inp.value==="NONE" || o.value==="NONE") o.checked=false;
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ans]"), function(t){
    t.addEventListener("input", function(){
      var k=t.getAttribute("data-ans");
      STATE.answers[k]=t.value;
      var c=document.querySelector("[data-cnt='"+k+"']");
      if(c) c.textContent=wordCount(t.value);
      clearTimeout(window.__sv); window.__sv=setTimeout(function(){ autosave(); drawRail(); },400);
    });
  });
  var bd=document.getElementById("btnDownload"); if(bd) bd.addEventListener("click", downloadRecord);
  var bc=document.getElementById("btnCopy");     if(bc) bc.addEventListener("click", copyRecord);
  var bm=document.getElementById("btnMail");     if(bm) bm.addEventListener("click", mailRecord);
  var bp=document.getElementById("btnPost");     if(bp) bp.addEventListener("click", postRecord);
}

function download(name, text, type){
  try{
    var b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },600);
    return true;
  }catch(e){ return false; }
}
function slug(){ return (STATE.name||"unnamed").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "unnamed"; }

function saveProgress(){
  STATE.saved=new Date().toISOString();
  var ok=download("Part-note-code-training-progress-"+slug()+".json", JSON.stringify(STATE,null,2), "application/json");
  toast(ok ? "Progress file downloaded. Reopen it with Resume." : "This browser blocked the download. Use Copy as text on the Review and send page instead.");
}
function loadProgress(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o || !o.checks || !o.answers) throw new Error("shape");
      STATE=normalize(o); document.getElementById("who").value=STATE.name||"";
      autosave(); go("start");
      toast("Progress restored.");
    }catch(e){ toast("That file is not a training progress file. Look for Part-note-code-training-progress-….json"); }
  };
  r.onerror=function(){ toast("The file could not be read. Try selecting it again."); };
  r.readAsText(file);
}

   "<table class='meta'><tr><th>Trainee</th><td>"+esc(STATE.name||"(name not entered)")+"</td></tr>"+
   "<tr><th>Company</th><td>"+esc(CONFIG.companyName)+"</td></tr>"+
   "<tr><th>Completed</th><td>"+esc(new Date().toLocaleString())+"</td></tr>"+
   "<tr><th>Checks</th><td>"+c.right+" of "+c.totalChecks+" correct on the first attempt ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)</td></tr>"+
   "<tr><th>Drill</th><td>"+c.drillRight+" of "+c.totalDrill+" lines coded right on the first attempt</td></tr>"+
   "<tr><th>Exercises</th><td>"+c.filledParts+" of "+c.totalParts+" answers written</td></tr></table>"+
   "<h2>Section checks</h2><table><colgroup><col style='width:88px'><col><col style='width:150px'></colgroup><thead><tr><th>Section</th><th>Title</th><th class='r'>Result</th></tr></thead><tbody>"+rows+"</tbody></table>"+
   "<h2>Parts-list drill</h2><table><thead><tr><th>Line</th><th>Item</th><th>Coded</th><th>Takes</th><th class='r'>Result</th></tr></thead><tbody>"+drows+"</tbody></table>"+
   ex+"</body></html>";
}
function downloadRecord(){
  var ok=download("Part-note-code-training-record-"+slug()+".html", recordHtml(), "text/html;charset=utf-8");
  toast(ok ? "Record downloaded. Attach it to an email to "+CONFIG.trainerName+"." : "This browser blocked the download. Use Copy as text instead.");
}
function copyRecord(){
  var txt=recordLines();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Record copied. Paste it into an email or chat."); },
      function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var t=document.createElement("textarea");
  t.value=txt; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  toast(ok ? "Record copied. Paste it into an email or chat." : "Copying is blocked here. Use Download the record instead.");
}
function mailRecord(){
  var subj="Part note code training record: "+(STATE.name||"unnamed")+": "+recordNo();
  var body=recordLines();
  var url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  if(url.length>1900){
    var c=counts();
    var shortBody="Part note codes, part traceability, and product-unit records: training record\n"+recordNo()+
      "\nTrainee: "+(STATE.name||"(name not entered)")+
      "\nChecks: "+c.right+" of "+c.totalChecks+" correct first time"+
      "\nDrill: "+c.drillRight+" of "+c.totalDrill+" lines coded right first time"+
      "\nExercises: "+c.filledParts+" of "+c.totalParts+" answers written"+
      "\n\nThe full record, including all written answers, is attached.\n(If it is not attached yet: go back to the training, choose Download the record, and attach the file.)";
    url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(shortBody);
    downloadRecord();
    toast("Answers are too long for an email body, so the record was downloaded. Attach it to the message.");
  }
  window.location.href=url;
}
function postRecord(){
  var b=document.getElementById("btnPost");
  b.disabled=true; b.textContent="Sending…";
  var payload={ record:recordNo(), name:STATE.name||"", company:CONFIG.companyName,
    completed:new Date().toISOString(), score:counts(), checks:STATE.checks, drills:STATE.drills, answers:STATE.answers };
  fetch(CONFIG.submitEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
   .then(function(r){
      if(r.ok){ b.textContent="Sent"; toast("Sent to "+CONFIG.trainerName+"."); }
      else{ b.disabled=false; b.textContent="Send to trainer"; toast("The server refused it ("+r.status+"). Download the record and email it instead."); }
   })
   .catch(function(){
      b.disabled=false; b.textContent="Send to trainer";
      toast("Could not reach the server. Download the record and email it instead.");
   });
}

/* ==========================================================================
   MISC
   ========================================================================== */
var toastT;
function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },4200);
}

document.getElementById("who").addEventListener("input", function(e){
  STATE.name=e.target.value; autosave();
});
document.getElementById("btnSave").addEventListener("click", saveProgress);
document.getElementById("btnLoad").addEventListener("click", function(){ document.getElementById("fileIn").click(); });
document.getElementById("btnClear").addEventListener("click", function(){
  if(CLEAR_ARMED) resetAll(); else armClear();
});
document.getElementById("btnClear").addEventListener("blur", function(){ setTimeout(disarmClear, 200); });
document.getElementById("fileIn").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]) loadProgress(e.target.files[0]);
  e.target.value="";
});
document.getElementById("railToggle").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("rail").classList.toggle("open");
});
document.querySelector("main").addEventListener("click", function(){
  document.getElementById("rail").classList.remove("open");
});
document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var i=pageIndex();
  if(e.key==="ArrowRight" && i<PAGES.length-1) go(pageKey(PAGES[i+1]));
  if(e.key==="ArrowLeft"  && i>0)              go(pageKey(PAGES[i-1]));
});

document.getElementById("brandSub").textContent = CONFIG.companyName + " · interactive modules";
if(autoload()){ document.getElementById("who").value = STATE.name||""; }
draw();
</script>
</body>
</html>
